<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>Castle Defense VR | Digital Arts Project</title>
    <script src="https://aframe.io/releases/1.4.0/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/gh/c-frame/aframe-physics-system@v4.2.2/dist/aframe-physics-system.min.js"></script>
    
    <script>
      let score = 0;
      let health = 100;
      let gameActive = true;

      AFRAME.registerComponent('enemy-logic', {
        init: function () {
          this.speed = 0.05 + (Math.random() * 0.05);
        },
        tick: function () {
          if (!gameActive) return;
          // Οι εχθροί κινούνται προς τον παίκτη (0, 0, 0)
          let pos = this.el.getAttribute('position');
          pos.z += this.speed;
          this.el.setAttribute('position', pos);

          // Αν ο εχθρός φτάσει πολύ κοντά, χάνεις ζωή
          if (pos.z > -2) {
            health -= 10;
            this.destroyEnemy();
            document.querySelector('#healthUI').setAttribute('value', `Health: ${health}%`);
            if (health <= 0) alert("Το κάστρο έπεσε! Game Over.");
          }
        },
        destroyEnemy: function () {
          if (this.el.parentNode) this.el.parentNode.removeChild(this.el);
        }
      });

      AFRAME.registerComponent('game-manager', {
        init: function () {
          this.cameraEl = document.querySelector('[camera]');
          this.el.sceneEl.addEventListener('click', this.shoot.bind(this));
          
          // Δημιουργία εχθρών κάθε 2 δευτερόλεπτα
          setInterval(() => {
            if (gameActive) this.spawnEnemy();
          }, 2000);
        },

        spawnEnemy: function () {
          const enemy = document.createElement('a-sphere');
          const xPos = (Math.random() * 20) - 10;
          enemy.setAttribute('position', `${xPos} 1.5 -30`);
          enemy.setAttribute('radius', '0.7');
          enemy.setAttribute('color', 'red');
          enemy.setAttribute('dynamic-body', 'mass: 1');
          enemy.setAttribute('enemy-logic', '');
          enemy.setAttribute('class', 'enemy');
          this.el.sceneEl.appendChild(enemy);
        },

        shoot: function () {
          const ball = document.createElement('a-sphere');
          const direction = new THREE.Vector3();
          this.cameraEl.object3D.getWorldDirection(direction);
          direction.multiplyScalar(-1);

          const pos = new THREE.Vector3();
          this.cameraEl.object3D.getWorldPosition(pos);
          pos.add(direction.clone().multiplyScalar(2));

          ball.setAttribute('position', pos);
          ball.setAttribute('radius', '0.4');
          ball.setAttribute('color', 'black');
          ball.setAttribute('dynamic-body', 'mass: 10');
          this.el.sceneEl.appendChild(ball);

          ball.addEventListener('body-loaded', () => {
            const velocity = direction.multiplyScalar(50);
            ball.body.velocity.set(velocity.x, velocity.y + 2, velocity.z);
          });

          // Ανίχνευση σύγκρουσης με εχθρό
          ball.addEventListener('collide', (e) => {
            if (e.detail.body.el.classList.contains('enemy')) {
              score += 10;
              document.querySelector('#scoreUI').setAttribute('value', `Score: ${score}`);
              e.detail.body.el.components['enemy-logic'].destroyEnemy();
            }
          });

          setTimeout(() => { if(ball.parentNode) ball.parentNode.removeChild(ball); }, 3000);
        }
      });
    </script>
  </head>
  <body>
    <a-scene physics="gravity: 0; debug: false" game-manager>
      <a-sky color="#222"></a-sky>
      <a-plane static-body rotation="-90 0 0" width="100" height="100" color="#333"></a-plane>

      <a-entity camera look-controls position="0 1.6 0">
        <a-cursor color="cyan"></a-cursor>
        <a-entity position="0 1 -2">
          <a-text id="scoreUI" value="Score: 0" align="center" color="white" width="3"></a-text>
          <a-text id="healthUI" value="Health: 100%" align="center" position="0 -0.2 0" color="red" width="2"></a-text>
        </a-entity>
      </a-entity>
      
      <a-box position="0 1 -1" width="2" height="3" depth="2" color="#444" static-body></a-box>
    </a-scene>
  </body>
</html>
