<!DOCTYPE html>
<html lang="el">
<head>
    <meta charset="utf-8">
    <title>VR II: The Grid - TRON Legacy Edition</title>
    <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
    <script>
        const CELL_SIZE = 4;
        
        // TRON Χρωματική Παλέτα
        const TRON_COLORS = {
            heroCyan: '#00FFFF',
            enemyOrange: '#FF4500',
            dataWhite: '#FFFFFF',
            gridBlue: '#0000FF',
            skyBlack: '#000000',
            neonMagenta: '#FF00FF',
            neonLime: '#00FF00',
            neonPurple: '#BF00FF',
            neonYellow: '#FFFF00',
            virusRed: '#FF0000',
            virusGlitch: '#FF3300' // Πιο έντονο, "σπασμένο" κόκκινο
        };

        const COLOR_CYCLE = [
            TRON_COLORS.heroCyan, 
            TRON_COLORS.neonMagenta, 
            TRON_COLORS.neonLime, 
            TRON_COLORS.neonPurple, 
            TRON_COLORS.neonYellow
        ];

        // ΜΗΧΑΝΗ ΗΧΟΥ
        const SoundEngine = {
            ctx: null,
            init: function() {
                if (!this.ctx) {
                    this.ctx = new (window.AudioContext || window.webkitAudioContext)();
                }
                if (this.ctx.state === 'suspended') {
                    this.ctx.resume();
                }
            },
            playTone: function(freq, type, duration, vol=0.5) {
                if (!this.ctx) return;
                let osc = this.ctx.createOscillator();
                let gain = this.ctx.createGain();
                osc.type = type;
                osc.frequency.setValueAtTime(freq, this.ctx.currentTime);
                gain.gain.setValueAtTime(vol, this.ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + duration);
                osc.connect(gain);
                gain.connect(this.ctx.destination);
                osc.start();
                osc.stop(this.ctx.currentTime + duration);
            },
            playDiscCollect: function() {
                this.init();
                this.playTone(880, 'sine', 0.2, 0.3); 
                setTimeout(() => this.playTone(1760, 'sine', 0.4, 0.3), 100); 
            },
            playPortalOpen: function() {
                this.init();
                if (!this.ctx) return;
                let osc = this.ctx.createOscillator();
                let gain = this.ctx.createGain();
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(100, this.ctx.currentTime);
                osc.frequency.linearRampToValueAtTime(600, this.ctx.currentTime + 2); 
                gain.gain.setValueAtTime(0.5, this.ctx.currentTime);
                gain.gain.linearRampToValueAtTime(0, this.ctx.currentTime + 3);
                osc.connect(gain);
                gain.connect(this.ctx.destination);
                osc.start();
                osc.stop(this.ctx.currentTime + 3);
            },
            playDerezzed: function() {
                this.init();
                if (!this.ctx) return;
                let osc = this.ctx.createOscillator();
                let gain = this.ctx.createGain();
                osc.type = 'square';
                osc.frequency.setValueAtTime(200, this.ctx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(10, this.ctx.currentTime + 1.5); 
                gain.gain.setValueAtTime(0.6, this.ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + 1.5);
                osc.connect(gain);
                gain.connect(this.ctx.destination);
                osc.start();
                osc.stop(this.ctx.currentTime + 1.5);
            },
            playVictory: function() {
                this.init();
                if (!this.ctx) return;
                [523.25, 659.25, 783.99, 1046.50].forEach(freq => {
                    let osc = this.ctx.createOscillator();
                    let gain = this.ctx.createGain();
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(freq, this.ctx.currentTime);
                    gain.gain.setValueAtTime(0, this.ctx.currentTime);
                    gain.gain.linearRampToValueAtTime(0.2, this.ctx.currentTime + 2);
                    gain.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + 8);
                    osc.connect(gain);
                    gain.connect(this.ctx.destination);
                    osc.start();
                    osc.stop(this.ctx.currentTime + 8);
                });
            }
        };

        AFRAME.registerComponent('procedural-maze', {
            init: function () {
                this.player = document.querySelector('#camera');
                this.mazeContainer = document.querySelector('#maze-container');
                this.messageUI = document.querySelector('#hud-message');
                this.invUI = document.querySelector('#hud-inv');
                this.levelUI = document.querySelector('#hud-level');
                this.timerUI = document.querySelector('#hud-timer');
                this.floor = document.querySelector('#floor-grid');
                this.skyEl = document.querySelector('#sky-bg'); 
                
                this.currentLevel = 1;
                this.maxLevels = 10;
                this.lastPos = new THREE.Vector3();
                this.wonGame = false;
                
                this.timeRemaining = 0;
                this.timerActive = false;
                this.virus = null;
                
                this.activeWallColor = new THREE.Color(TRON_COLORS.heroCyan);
                this.enemyColorObj = new THREE.Color(TRON_COLORS.enemyOrange);
                
                this.minimapCanvas = document.getElementById('minimap-canvas');
                this.minimapCtx = this.minimapCanvas.getContext('2d');
                this.minimapPlane = document.getElementById('minimap-plane');

                // Λειτουργία On/Off για το Ραντάρ με το πλήκτρο 'M'
                window.addEventListener('keydown', (e) => {
                    if (e.key.toLowerCase() === 'm') {
                        if (this.minimapPlane) {
                            let isVisible = this.minimapPlane.getAttribute('visible');
                            this.minimapPlane.setAttribute('visible', !isVisible);
                        }
                    }
                });

                window.addEventListener('click', () => {
                    SoundEngine.init();
                    let bgm = document.querySelector('#bgm');
                    if(bgm && bgm.paused) {
                        bgm.volume = 0.5;
                        bgm.play().catch(e => console.log("Audio play failed:", e));
                    }
                }, {once:true});

                this.loadLevel(this.currentLevel);
            },

            generateMap: function(size) {
                let map = Array(size).fill().map(() => Array(size).fill(1));
                function carve(x, y) {
                    map[y][x] = 0;
                    let dirs = [[0,-1],[0,1],[-1,0],[1,0]].sort(() => Math.random() - 0.5);
                    for (let d of dirs) {
                        let nx = x + d[0]*2, ny = y + d[1]*2;
                        if (nx > 0 && nx < size-1 && ny > 0 && ny < size-1 && map[ny][nx] === 1) {
                            map[y+d[1]][x+d[0]] = 0;
                            carve(nx, ny);
                        }
                    }
                }
                carve(1, 1);
                return map;
            },

            loadLevel: function(level) {
                this.mazeContainer.innerHTML = '';
                this.shards = [];
                this.walls = [];
                this.exitEl = null;
                this.shardsCollected = 0;
                this.levelWon = false;
                this.virus = null; 
                this.virusTendrils = []; // Λίστα για τα πλοκάμια
                
                this.activeWallColor.set(TRON_COLORS.heroCyan);

                if (this.skyEl) {
                    this.skyEl.setAttribute('src', `image${level}.jpg`);
                }

                this.mapSize = 7 + (level * 2); 
                this.totalShards = 2 + Math.floor(level / 2); 
                this.currentMap = this.generateMap(this.mapSize);
                
                this.timeRemaining = 45 + (level * 15);
                this.timerActive = true;

                let emptySpots = [];
                for (let z = 1; z < this.mapSize - 1; z++) {
                    for (let x = 1; x < this.mapSize - 1; x++) {
                        if (this.currentMap[z][x] === 0 && (x !== 1 || z !== 1)) {
                            emptySpots.push({x, z});
                        }
                    }
                }
                emptySpots = emptySpots.sort(() => Math.random() - 0.5); 

                for (let z = 0; z < this.mapSize; z++) {
                    for (let x = 0; x < this.mapSize; x++) {
                        let px = x * CELL_SIZE;
                        let pz = z * CELL_SIZE;

                        if (this.currentMap[z][x] === 1) {
                            let wall = document.createElement('a-box');
                            wall.setAttribute('position', `${px} 2 ${pz}`);
                            wall.setAttribute('width', CELL_SIZE);
                            wall.setAttribute('height', 4);
                            wall.setAttribute('depth', CELL_SIZE);
                            wall.setAttribute('material', `color: #050505; wireframe: false; transparent: true; opacity: 0.95; roughness: 0.2; metalness: 0.8`);
                            this.mazeContainer.appendChild(wall);
                            this.walls.push(wall);
                        }
                    }
                }

                for (let i = 0; i < this.totalShards; i++) {
                    let spot = emptySpots.pop();
                    this.currentMap[spot.z][spot.x] = 3; 
                    
                    let discEntity = document.createElement('a-entity');
                    discEntity.setAttribute('position', `${spot.x * CELL_SIZE} 1.6 ${spot.z * CELL_SIZE}`);
                    discEntity.setAttribute('animation', 'property: rotation; to: 0 360 0; loop: true; dur: 1000; easing: linear');
                    discEntity.setAttribute('visible', 'false'); 

                    let disc = document.createElement('a-torus');
                    disc.setAttribute('radius', 0.5);
                    disc.setAttribute('radius-tubular', 0.05);
                    disc.setAttribute('color', TRON_COLORS.dataWhite);
                    disc.setAttribute('material', `emissive: ${TRON_COLORS.heroCyan}; emissiveIntensity: 2; shader: flat`);
                    disc.setAttribute('rotation', '90 0 0'); 
                    disc.setAttribute('animation__pulse', 'property: scale; from: 1 1 1; to: 1.1 1.1 1.1; dur: 500; dir: alternate; loop: true');

                    discEntity.appendChild(disc);
                    discEntity.gridPos = {x: spot.x, z: spot.z};
                    this.mazeContainer.appendChild(discEntity);
                    this.shards.push(discEntity);
                }

                let exitSpot = emptySpots.pop();
                this.currentMap[exitSpot.z][exitSpot.x] = 2; 
                this.exitEl = document.createElement('a-cylinder');
                this.exitEl.setAttribute('position', `${exitSpot.x * CELL_SIZE} 10 ${exitSpot.z * CELL_SIZE}`); 
                this.exitEl.setAttribute('radius', 1);
                this.exitEl.setAttribute('height', 20);
                this.exitEl.setAttribute('material', `color: ${TRON_COLORS.dataWhite}; emissive: ${TRON_COLORS.enemyOrange}; emissiveIntensity: 5; shader: flat; opacity: 0.7; transparent: true`);
                this.exitEl.setAttribute('visible', 'false'); 
                this.mazeContainer.appendChild(this.exitEl);

                let exitLight = document.createElement('a-light');
                exitLight.setAttribute('type', 'point');
                exitLight.setAttribute('color', TRON_COLORS.enemyOrange);
                exitLight.setAttribute('intensity', 3);
                exitLight.setAttribute('distance', 15);
                this.exitEl.appendChild(exitLight);

                // --- ΝΕΟΣ, ΑΠΕΙΛΗΤΙΚΟΣ ΙΟΣ: THE GLITCH CORRUPTION ---
                this.virus = document.createElement('a-entity');
                let virusStartX = (this.mapSize - 2) * CELL_SIZE; 
                let virusStartZ = (this.mapSize - 2) * CELL_SIZE;
                this.virus.setAttribute('position', `${virusStartX} 1.6 ${virusStartZ}`);

                // 1. Ο "Glitch" Πυρήνας (Ακανόνιστο σύννεφο που στριφογυρίζει)
                let core = document.createElement('a-tetrahedron');
                core.setAttribute('radius', '1.2');
                core.setAttribute('material', `color: #000000; emissive: ${TRON_COLORS.virusGlitch}; emissiveIntensity: 1; wireframe: true; wireframeLinewidth: 2`);
                core.setAttribute('animation__rot', `property: rotation; dur: 1000; to: 360 360 360; loop: true; easing: linear`);
                core.setAttribute('animation__glitch', `property: scale; dir: alternate; dur: 200; to: 1.1 0.8 1.2; loop: true; easing: easeInOutSine`);
                this.virus.appendChild(core);

                // 2. Τα "Electric Tendrils" (Πלוκάμια Ενέργειας)
                // Δημιουργούμε 4 παλλόμενους δακτυλίους που δονούνται βίαια
                for (let i = 0; i < 4; i++) {
                    let tendril = document.createElement('a-torus');
                    tendril.setAttribute('radius', 1.0 + (i * 0.2));
                    tendril.setAttribute('radius-tubular', '0.02');
                    
                    // Τυχαίος αρχικός άξονας περιστροφής
                    let rx = Math.random() * 360;
                    let ry = Math.random() * 360;
                    tendril.setAttribute('rotation', `${rx} ${ry} 0`);
                    
                    tendril.setAttribute('material', `color: #000000; emissive: ${TRON_COLORS.virusRed}; emissiveIntensity: 4; shader: flat; transparent: true; opacity: 0.8`);
                    
                    // Δυναμική κίνηση πλοκαμιών: Στριφογυρίζουν και πάλλονται
                    let rotDur = 2000 + (i * 500);
                    tendril.setAttribute('animation__rot', `property: rotation; dur: ${rotDur}; to: ${rx + 360} ${ry - 360} 360; loop: true; easing: linear`);
                    
                    // Δόνηση (Vibration) για οργανική αίσθηση
                    let vibDur = 100 + (i * 50);
                    tendril.setAttribute('animation__vib', `property: scale; dir: alternate; dur: ${vibDur}; to: 1.05 0.95 1.05; loop: true; easing: linear`);
                    
                    this.virus.appendChild(tendril);
                    this.virusTendrils.push(tendril); // Αποθήκευση για την "εξαγρίωση"
                }

                // 3. Το απειλητικό φως
                let vLight = document.createElement('a-light');
                vLight.setAttribute('type', 'point');
                vLight.setAttribute('color', TRON_COLORS.virusGlitch);
                vLight.setAttribute('intensity', '3');
                vLight.setAttribute('distance', '12');
                vLight.setAttribute('animation__flicker', `property: intensity; dir: alternate; dur: 100; to: 1; loop: true; easing: linear`);
                this.virus.appendChild(vLight);

                this.mazeContainer.appendChild(this.virus);
                // -------------------------------------------------------------------

                this.player.setAttribute('position', `${1 * CELL_SIZE} 1.6 ${1 * CELL_SIZE}`);
                this.lastPos.copy(this.player.getAttribute('position'));
                
                this.floor.setAttribute('color', TRON_COLORS.gridBlue);
                this.levelUI.innerText = `SECTOR: ${this.currentLevel} / ${this.maxLevels}`;
                this.messageUI.innerText = "ΚΛΙΚ ΓΙΑ ΕΝΑΡΞΗ | [M] ΓΙΑ RADAR";
                this.messageUI.style.color = TRON_COLORS.dataWhite;
                this.messageUI.style.borderColor = TRON_COLORS.heroCyan;
                this.updateUI();
                this.updateTimerUI();
            },

            updateMinimap: function() {
                if (!this.currentMap || !this.minimapCtx) return;
                let ctx = this.minimapCtx;
                let size = 256;
                let mapLen = this.mapSize;
                let cSize = size / mapLen;
                ctx.clearRect(0, 0, size, size);
                ctx.save();
                ctx.beginPath();
                ctx.arc(size / 2, size / 2, size / 2 - 4, 0, 2 * Math.PI);
                ctx.fillStyle = 'rgba(0, 15, 30, 0.4)';
                ctx.fill();
                ctx.lineWidth = 3;
                ctx.strokeStyle = 'rgba(0, 255, 255, 0.3)';
                ctx.stroke();
                ctx.clip(); 
                ctx.fillStyle = 'rgba(0, 255, 255, 0.15)'; 
                for (let z = 0; z < mapLen; z++) {
                    for (let x = 0; x < mapLen; x++) {
                        if (this.currentMap[z][x] === 1) {
                            ctx.fillRect(x * cSize, z * cSize, cSize - 1, cSize - 1);
                        }
                    }
                }
                ctx.beginPath();
                ctx.moveTo(size / 2, 0); ctx.lineTo(size / 2, size);
                ctx.moveTo(0, size / 2); ctx.lineTo(size, size / 2);
                ctx.lineWidth = 1;
                ctx.strokeStyle = 'rgba(0, 255, 255, 0.1)';
                ctx.stroke();
                let pPos = this.player.object3D.position;
                let px = (pPos.x / (mapLen * CELL_SIZE)) * size;
                let pz = (pPos.z / (mapLen * CELL_SIZE)) * size;
                ctx.fillStyle = TRON_COLORS.heroCyan;
                ctx.beginPath();
                ctx.arc(px, pz, cSize / 1.5, 0, 2 * Math.PI);
                ctx.fill();
                if (this.virus) {
                    let vPos = this.virus.object3D.position;
                    let vx = (vPos.x / (mapLen * CELL_SIZE)) * size;
                    let vz = (vPos.z / (mapLen * CELL_SIZE)) * size;
                    ctx.fillStyle = TRON_COLORS.virusRed;
                    ctx.beginPath();
                    ctx.arc(vx, vz, cSize / 1.2, 0, 2 * Math.PI);
                    ctx.fill();
                }
                ctx.restore();
                if (this.minimapPlane && this.minimapPlane.getObject3D('mesh')) {
                    let material = this.minimapPlane.getObject3D('mesh').material;
                    if (material.map) material.map.needsUpdate = true;
                }
            },

            tick: function (time, timeDelta) {
                if (this.wonGame || this.levelWon) return;

                let pPos = this.player.object3D.position;
                this.updateMinimap();

                if (this.timerActive) {
                    this.timeRemaining -= (timeDelta / 1000); 
                    if (this.timeRemaining <= 0) {
                        this.timeRemaining = 0;
                        this.triggerGameOver('timeout');
                    }
                    this.updateTimerUI();

                    if (this.virus) {
                        let vPos = this.virus.object3D.position;
                        let distToPlayer = vPos.distanceTo(pPos);
                        
                        if (distToPlayer < 2.5) { // Αυξημένη ακτίνα μόλυνσης λόγω πλοκαμιών
                            this.triggerGameOver('virus');
                            this.virus = null;
                        } else {
                            // --- ΛΟΓΙΚΗ ΚΙΝΗΣΗΣ ΚΑΙ "ΕΞΑΓΡΙΩΣΗΣ" ΙΟΥ ---
                            let speeds = { normal: 1.5, frenzy: 4.8 };
                            let isFrenzy = this.timeRemaining < 20;
                            let speed = isFrenzy ? speeds.frenzy : speeds.normal; 
                            
                            // Αν εξαγριωθεί, τα πλοκάμια δονούνται βίαια (Glitch frenzy)
                            if (isFrenzy && this.virusTendrils) {
                                this.virusTendrils.forEach(tendril => {
                                    tendril.setAttribute('animation__vib', 'dur: 50; to: 1.2 0.8 1.2'); // Πολύ πιο γρήγορος και έντονος παλμός
                                });
                            }

                            let dir = new THREE.Vector3().subVectors(pPos, vPos).normalize();
                            vPos.x += dir.x * speed * (timeDelta / 1000);
                            vPos.z += dir.z * speed * (timeDelta / 1000);
                            // Πιο έντονη "οργανική" αιώρηση
                            vPos.y = 1.6 + Math.sin(time / 150) * 0.4;
                        }
                    }
                }

                let gridX = Math.round(pPos.x / CELL_SIZE);
                let gridZ = Math.round(pPos.z / CELL_SIZE);

                let rezRadius = 16; 
                this.walls.forEach(wall => {
                    let mesh = wall.getObject3D('mesh');
                    if (mesh && mesh.material) {
                        let dist = pPos.distanceTo(wall.object3D.position);
                        let intensity = Math.max(0.0, 1 - (dist / rezRadius));
                        
                        mesh.material.emissive.copy(this.activeWallColor);
                        mesh.material.emissiveIntensity = intensity * 2.5;
                        mesh.material.opacity = 0.95;
                    }
                });

                let visibilityRadius = 5; 
                this.shards.forEach(shard => {
                    if (shard.parentNode) {
                        let dist = pPos.distanceTo(shard.object3D.position);
                        if (dist < visibilityRadius) {
                            shard.setAttribute('visible', 'true');
                        } else {
                            shard.setAttribute('visible', 'false');
                        }
                    }
                });

                if (gridZ >= 0 && gridZ < this.currentMap.length && gridX >= 0 && gridX < this.currentMap[0].length) {
                    let tileType = this.currentMap[gridZ][gridX];

                    if (tileType === 3) {
                        this.collectShard(gridX, gridZ);
                        return;
                    }

                    if (tileType === 2 && this.shardsCollected === this.totalShards) {
                        this.nextLevel();
                        return;
                    }

                    if (tileType === 1) {
                        this.player.setAttribute('position', this.lastPos);
                    } else {
                        this.lastPos.copy(pPos);
                    }
                } else {
                    this.lastPos.copy(pPos);
                }
            },

            collectShard: function(x, z) {
                this.currentMap[z][x] = 0; 
                this.shardsCollected++;
                
                SoundEngine.playDiscCollect();

                if (this.shardsCollected < this.totalShards) {
                    let nextColorHex = COLOR_CYCLE[this.shardsCollected % COLOR_CYCLE.length];
                    this.activeWallColor.set(nextColorHex);
                    this.floor.setAttribute('color', nextColorHex);
                    this.messageUI.style.borderColor = nextColorHex;
                }

                let shardToRemove = this.shards.find(s => s.gridPos.x === x && s.gridPos.z === z);
                if (shardToRemove && shardToRemove.parentNode) {
                    shardToRemove.parentNode.removeChild(shardToRemove);
                }

                this.updateUI();

                if (this.shardsCollected === this.totalShards) {
                    SoundEngine.playPortalOpen();
                    this.timerActive = false;
                    
                    if(this.virus && this.virus.parentNode) {
                        this.virus.parentNode.removeChild(this.virus);
                        this.virus = null;
                    }

                    this.messageUI.innerText = "PORTAL ΕΝΕΡΓΟΠΟΙΗΘΗΚΕ!";
                    this.messageUI.style.color = TRON_COLORS.enemyOrange;
                    this.messageUI.style.borderColor = TRON_COLORS.enemyOrange;
                    this.exitEl.setAttribute('visible', 'true');
                    
                    this.activeWallColor.copy(this.enemyColorObj);
                    this.floor.setAttribute('color', TRON_COLORS.enemyOrange);
                } else {
                    this.messageUI.innerText = "ΣΥΣΤΗΜΑ ΑΝΑΒΑΘΜΙΣΤΗΚΕ";
                    setTimeout(() => { 
                        if(!this.levelWon && this.timerActive) this.messageUI.innerText = "ΨΑΞΕ ΣΤΟ 'GRID'..."; 
                    }, 1500);
                }
            },

            triggerGameOver: function(reason) {
                this.timerActive = false;
                SoundEngine.playDerezzed();
                
                if (reason === 'virus') {
                    this.messageUI.innerText = "ΚΡΙΣΙΜΟ ΣΦΑΛΜΑ: ΜΟΛΥΝΣΗ ΑΠΟ ΙΟ\nΕΠΑΝΑΦΟΡΑ ΣΥΣΤΗΜΑΤΟΣ.";
                } else {
                    this.messageUI.innerText = "DEREZZED: ΤΕΛΟΣ ΧΡΟΝΟΥ\nΕΠΑΝΑΦΟΡΑ ΣΥΣΤΗΜΑΤΟΣ.";
                }

                this.messageUI.style.color = TRON_COLORS.virusRed;
                this.messageUI.style.borderColor = TRON_COLORS.virusRed;
                this.activeWallColor.set(TRON_COLORS.virusRed);
                this.floor.setAttribute('color', TRON_COLORS.virusRed);
                
                setTimeout(() => this.loadLevel(this.currentLevel), 3000);
            },

            updateTimerUI: function() {
                let secs = Math.ceil(this.timeRemaining);
                this.timerUI.innerText = `TIME: ${secs}s`;
                
                if (secs <= 20) {
                    this.timerUI.style.color = TRON_COLORS.virusRed;
                    this.timerUI.style.borderColor = TRON_COLORS.virusRed;
                } else {
                    this.timerUI.style.color = this.activeWallColor.getStyle(); 
                    this.timerUI.style.borderColor = this.activeWallColor.getStyle();
                }
            },

            updateUI: function() {
                this.invUI.innerText = `DISCS: ${this.shardsCollected} / ${this.totalShards}`;
            },

            nextLevel: function() {
                this.levelWon = true;
                this.timerActive = false;
                if (this.currentLevel >= this.maxLevels) {
                    this.wonGame = true;
                    let bgm = document.querySelector('#bgm');
                    if(bgm) bgm.pause();
                    SoundEngine.playVictory();
                    this.player.removeAttribute('wasd-controls');
                    this.invUI.style.display = 'none';
                    this.levelUI.style.display = 'none';
                    this.timerUI.style.display = 'none';
                    
                    if(this.minimapPlane) this.minimapPlane.setAttribute('visible', 'false');

                    this.messageUI.innerText = "ΠΡΟΣΒΑΣΗ ΣΤΟΝ ΔΗΜΙΟΥΡΓΟ...";
                    this.messageUI.style.color = TRON_COLORS.dataWhite;
                    this.messageUI.style.borderColor = TRON_COLORS.dataWhite;
                    let currPos = this.player.getAttribute('position');
                    this.player.setAttribute('animation__ascend', `property: position; to: ${currPos.x} 100 ${currPos.z}; dur: 8000; easing: easeInOutCubic`);
                    this.walls.forEach((wall) => {
                        let delay = Math.random() * 3000; 
                        setTimeout(() => {
                            let wPos = wall.object3D.position;
                            wall.setAttribute('animation__fall', `property: position; to: ${wPos.x} -50 ${wPos.z}; dur: 4000; easing: easeInQuad`);
                        }, delay);
                    });
                    setTimeout(() => {
                        this.messageUI.innerHTML = "ΕΞΟΔΟΣ ΑΠΟ ΤΟ GRID ΕΠΙΤΥΧΗΣ<br><br>ΕΡΓΑΣΙΑ: ΕΙΚΟΝΙΚΗ ΠΡΑΓΜΑΤΙΚΟΤΗΤΑ II";
                    }, 6000);
                } else {
                    this.messageUI.innerText = "ΠΟΡΤΑΛ ΑΝΟΙΧΤΟ!\nΜΕΤΑΦΟΡΑ ΣΕ ΝΕΟ ΤΟΜΕΑ...";
                    this.currentLevel++;
                    setTimeout(() => this.loadLevel(this.currentLevel), 3000);
                }
            }
        });
    </script>
</head>
<body style="margin: 0; overflow: hidden; background-color: #000;">

    <canvas id="minimap-canvas" width="256" height="256" style="display:none;"></canvas>

    <audio id="bgm" src="music.mp3" loop="true" preload="auto"></audio> 

    <div style="position: absolute; top: 5%; left: 0; width: 100%; text-align: center; z-index: 100; pointer-events: none;">
        <div id="hud-level" style="color: #FFD700; font-family: 'Courier New', Courier, monospace; font-size: 1.5rem; font-weight: bold; background: rgba(0, 0, 0, 0.9); display: inline-block; padding: 5px 15px; border-radius: 2px; margin-bottom: 5px; border: 1px solid #FFD700; text-transform: uppercase;">
            SECTOR: 1 / 10
        </div>
        <div id="hud-timer" style="color: #00FFFF; font-family: 'Courier New', Courier, monospace; font-size: 1.5rem; font-weight: bold; background: rgba(0, 0, 0, 0.9); display: inline-block; padding: 5px 15px; border-radius: 2px; margin-bottom: 5px; margin-left: 10px; border: 1px solid #00FFFF; text-transform: uppercase;">
            TIME: 60s
        </div>
        <br>
        <div id="hud-message" style="color: #ffffff; font-family: 'Courier New', Courier, monospace; font-size: 1.2rem; background: rgba(0, 0, 0, 0.9); display: inline-block; padding: 10px 20px; border-radius: 2px; border: 2px solid #00FFFF; white-space: pre-line; text-transform: uppercase; margin-bottom: 5px; letter-spacing: 2px;">
            ΦΟΡΤΩΣΗ...
        </div>
        <br>
        <div id="hud-inv" style="color: #00FFFF; font-family: 'Courier New', Courier, monospace; font-size: 1.2rem; font-weight: bold; background: rgba(0, 0, 0, 0.9); display: inline-block; padding: 8px 15px; border-radius: 2px; border: 1px solid #00FFFF;">
            DISCS: 0 / 2
        </div>
    </div>

    <a-scene procedural-maze fog="type: exponential; color: #000000; density: 0.015;">
        <a-sky id="sky-bg" src="image1.jpg" rotation="0 -90 0" material="fog: false"></a-sky>
        <a-light type="ambient" intensity="0.2" color="#444466"></a-light>
        <a-plane id="floor-grid" position="50 0 50" rotation="-90 0 0" width="300" height="300" color="#0000FF" wireframe="true" wireframe-linewidth="1" material="shader: flat"></a-plane>
        <a-entity id="maze-container"></a-entity>
        
        <a-entity id="camera" camera look-controls wasd-controls="acceleration: 25">
            <a-light type="point" intensity="0.5" distance="10" color="#00FFFF" position="0 0 -1"></a-light>
            
            <a-plane id="minimap-plane" position="0 -0.8 -1.5" rotation="-20 0 0" width="0.6" height="0.6" material="src: #minimap-canvas; transparent: true; opacity: 0.85; shader: flat" visible="true"></a-plane>
            
        </a-entity>
    </a-scene>

</body>
</html>
