<!DOCTYPE html>
<html lang="el">
  <head>
    <meta charset="utf-8">
    <title>VR Rail Shooter - Prototype</title>
    <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>

    <script>
      /* ========================================================
         1. ΣΥΣΤΗΜΑ ΚΙΝΗΣΗΣ (The Rail)
         Μετακινεί τον παίκτη (το Rig) συνεχώς προς τα εμπρός.
         ======================================================== */
      AFRAME.registerComponent('rail-mover', {
        schema: { speed: { type: 'number', default: 0.15 } },
        tick: function () {
          let pos = this.el.getAttribute('position');
          pos.z -= this.data.speed; // Προχωράμε βαθύτερα στον άξονα Z (αρνητικό)
          this.el.setAttribute('position', pos);
        }
      });

      /* ========================================================
         2. ΣΥΣΤΗΜΑ ΣΤΟΧΩΝ (Targets & Scoring)
         Διαχειρίζεται την αλληλεπίδραση και το σκορ.
         ======================================================== */
      let score = 0; // Η μεταβλητή του σκορ ξεκινάει από το 0

      AFRAME.registerComponent('target', {
        init: function () {
          let el = this.el;
          
          // ΤΙ ΓΙΝΕΤΑΙ ΟΤΑΝ ΤΟΝ ΚΟΙΤΑΜΕ (Hover)
          el.addEventListener('mouseenter', function () {
            el.setAttribute('color', '#ff0044'); // Γίνεται κόκκινος
            el.setAttribute('scale', '1.2 1.2 1.2'); // Μεγαλώνει λίγο
          });

          // ΤΙ ΓΙΝΕΤΑΙ ΟΤΑΝ ΠΑΙΡΝΟΥΜΕ ΤΟ ΒΛΕΜΜΑ ΜΑΣ (Mouse leave)
          el.addEventListener('mouseleave', function () {
            el.setAttribute('color', '#00ffaa'); // Επιστρέφει στο αρχικό πράσινο
            el.setAttribute('scale', '1 1 1');
          });

          // ΤΙ ΓΙΝΕΤΑΙ ΟΤΑΝ "ΠΥΡΟΒΟΛΑΜΕ" (Click/Fuse)
          el.addEventListener('click', function () {
            score += 10; // Προσθέτουμε 10 πόντους
            document.querySelector('#score-text').setAttribute('value', 'Score: ' + score);
            
            // Καταστρέφουμε τον στόχο
            el.parentNode.removeChild(el);
          });
        }
      });
    </script>
  </head>
  <body>
    <a-scene background="color: #050510">
      
      <a-entity id="rig" position="0 0 0" rail-mover>
        
        <a-camera position="0 1.6 0" look-controls wasd-controls="enabled: false">
          
          <a-entity cursor="fuse: true; fuseTimeout: 800"
                    raycaster="objects: .clickable"
                    position="0 0 -1"
                    geometry="primitive: ring; radiusInner: 0.02; radiusOuter: 0.03"
                    material="color: white; shader: flat"
                    animation__fusing="property: scale; startEvents: fusing; easing: easeInCubic; dur: 800; from: 1 1 1; to: 0.1 0.1 0.1"
                    animation__mouseleave="property: scale; startEvents: mouseleave; easing: easeInCubic; dur: 100; to: 1 1 1">
          </a-entity>
          
          <a-text id="score-text" value="Score: 0" position="-0.8 0.8 -1.5" color="#00ffff" width="3" font="monoid"></a-text>
        </a-camera>

      </a-entity>

      <a-plane position="0 0 -100" rotation="-90 0 0" width="40" height="400" color="#111" wireframe="true"></a-plane>
      
      <a-entity id="targets">
        <a-sphere class="clickable" target position="-3 2 -20" radius="0.8" color="#00ffaa"></a-sphere>
        <a-sphere class="clickable" target position="3 4 -30" radius="0.8" color="#00ffaa"></a-sphere>
        
        <a-sphere class="clickable" target position="0 6 -50" radius="0.8" color="#00ffaa"></a-sphere>
        <a-sphere class="clickable" target position="-5 1 -60" radius="0.8" color="#00ffaa"></a-sphere>
        <a-sphere class="clickable" target position="5 3 -70" radius="0.8" color="#00ffaa"></a-sphere>

        <a-sphere class="clickable" target position="-4 5 -90" radius="0.8" color="#00ffaa"></a-sphere>
        <a-sphere class="clickable" target position="4 1 -100" radius="0.8" color="#00ffaa"></a-sphere>
        <a-sphere class="clickable" target position="0 4 -120" radius="0.8" color="#00ffaa"></a-sphere>
      </a-entity>

    </a-scene>
  </body>
</html>
