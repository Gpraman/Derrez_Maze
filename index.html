<!DOCTYPE html>
<html lang="el">
<head>
    <meta charset="utf-8">
    <title>VR II: Memory Fragments (Bright Edition)</title>
    <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
    <script>
        const CELL_SIZE = 4;

        AFRAME.registerComponent('procedural-maze', {
            init: function () {
                this.player = document.querySelector('#camera');
                this.mazeContainer = document.querySelector('#maze-container');
                this.messageUI = document.querySelector('#hud-message');
                this.invUI = document.querySelector('#hud-inv');
                this.levelUI = document.querySelector('#hud-level');
                this.floor = document.querySelector('#floor-grid');
                
                this.currentLevel = 1;
                this.maxLevels = 10;
                this.lastPos = new THREE.Vector3();
                this.wonGame = false;
                
                this.loadLevel(this.currentLevel);
            },

            generateMap: function(size) {
                let map = Array(size).fill().map(() => Array(size).fill(1));
                
                function carve(x, y) {
                    map[y][x] = 0;
                    let dirs = [[0,-1],[0,1],[-1,0],[1,0]].sort(() => Math.random() - 0.5);
                    for (let d of dirs) {
                        let nx = x + d[0]*2, ny = y + d[1]*2;
                        if (nx > 0 && nx < size-1 && ny > 0 && ny < size-1 && map[ny][nx] === 1) {
                            map[y+d[1]][x+d[0]] = 0;
                            carve(nx, ny);
                        }
                    }
                }
                carve(1, 1);
                return map;
            },

            loadLevel: function(level) {
                this.mazeContainer.innerHTML = '';
                this.shards = [];
                this.walls = [];
                this.exitEl = null;
                this.shardsCollected = 0;
                this.levelWon = false;

                let mapSize = 7 + (level * 2); 
                this.totalShards = 2 + Math.floor(level / 2); 
                this.currentMap = this.generateMap(mapSize);

                let emptySpots = [];
                for (let z = 1; z < mapSize - 1; z++) {
                    for (let x = 1; x < mapSize - 1; x++) {
                        if (this.currentMap[z][x] === 0 && (x !== 1 || z !== 1)) {
                            emptySpots.push({x, z});
                        }
                    }
                }
                emptySpots = emptySpots.sort(() => Math.random() - 0.5); 

                for (let z = 0; z < mapSize; z++) {
                    for (let x = 0; x < mapSize; x++) {
                        let px = x * CELL_SIZE;
                        let pz = z * CELL_SIZE;

                        if (this.currentMap[z][x] === 1) {
                            let wall = document.createElement('a-box');
                            wall.setAttribute('position', `${px} 2 ${pz}`);
                            wall.setAttribute('width', CELL_SIZE);
                            wall.setAttribute('height', 4);
                            wall.setAttribute('depth', CELL_SIZE);
                            wall.setAttribute('color', '#ff0055');
                            wall.setAttribute('wireframe', 'true');
                            this.mazeContainer.appendChild(wall);
                            this.walls.push(wall);
                        }
                    }
                }

                for (let i = 0; i < this.totalShards; i++) {
                    let spot = emptySpots.pop();
                    this.currentMap[spot.z][spot.x] = 3; 
                    
                    let shard = document.createElement('a-octahedron');
                    shard.setAttribute('position', `${spot.x * CELL_SIZE} 1.6 ${spot.z * CELL_SIZE}`);
                    shard.setAttribute('color', '#00ffff');
                    shard.setAttribute('radius', 0.8);
                    shard.setAttribute('wireframe', 'true');
                    shard.setAttribute('visible', 'false'); 
                    shard.setAttribute('animation', 'property: rotation; to: 360 360 0; loop: true; dur: 3000');
                    
                    shard.gridPos = {x: spot.x, z: spot.z};
                    this.mazeContainer.appendChild(shard);
                    this.shards.push(shard);
                }

                let exitSpot = emptySpots.pop();
                this.currentMap[exitSpot.z][exitSpot.x] = 2; 
                this.exitEl = document.createElement('a-cylinder');
                this.exitEl.setAttribute('position', `${exitSpot.x * CELL_SIZE} 0 ${exitSpot.z * CELL_SIZE}`);
                this.exitEl.setAttribute('radius', 1.5);
                this.exitEl.setAttribute('height', 10);
                this.exitEl.setAttribute('color', '#00ff00');
                this.exitEl.setAttribute('wireframe', 'true');
                this.exitEl.setAttribute('visible', 'false'); 
                this.exitEl.setAttribute('animation', 'property: rotation; to: 0 360 0; loop: true; dur: 2000');
                this.mazeContainer.appendChild(this.exitEl);

                this.player.setAttribute('position', `${1 * CELL_SIZE} 1.6 ${1 * CELL_SIZE}`);
                this.lastPos.copy(this.player.getAttribute('position'));
                
                this.floor.setAttribute('color', '#ff0055');
                this.levelUI.innerText = `ΕΠΙΠΕΔΟ: ${this.currentLevel} / ${this.maxLevels}`;
                this.messageUI.innerText = "ΒΡΕΣ ΤΙΣ ΚΡΥΜΜΕΝΕΣ ΑΝΑΜΝΗΣΕΙΣ";
                this.messageUI.style.color = "#ffffff";
                this.updateUI();
            },

            tick: function () {
                if (this.wonGame || this.levelWon) return;

                let pos = this.player.getAttribute('position');
                let gridX = Math.round(pos.x / CELL_SIZE);
                let gridZ = Math.round(pos.z / CELL_SIZE);

                this.shards.forEach(shard => {
                    if (shard.parentNode) {
                        let dist = pos.distanceTo(shard.object3D.position);
                        if (dist < 12) {
                            shard.setAttribute('visible', 'true');
                        } else {
                            shard.setAttribute('visible', 'false');
                        }
                    }
                });

                if (gridZ >= 0 && gridZ < this.currentMap.length && gridX >= 0 && gridX < this.currentMap[0].length) {
                    let tileType = this.currentMap[gridZ][gridX];

                    if (tileType === 3) {
                        this.collectShard(gridX, gridZ);
                        return;
                    }

                    if (tileType === 2 && this.shardsCollected === this.totalShards) {
                        this.nextLevel();
                        return;
                    }

                    if (tileType === 1) {
                        this.player.setAttribute('position', this.lastPos);
                    } else {
                        this.lastPos.copy(pos);
                    }
                } else {
                    this.lastPos.copy(pos);
                }
            },

            collectShard: function(x, z) {
                this.currentMap[z][x] = 0; 
                this.shardsCollected++;
                
                let shardToRemove = this.shards.find(s => s.gridPos.x === x && s.gridPos.z === z);
                if (shardToRemove && shardToRemove.parentNode) {
                    shardToRemove.parentNode.removeChild(shardToRemove);
                }

                this.walls.forEach(wall => wall.setAttribute('color', '#00ffff'));
                this.floor.setAttribute('color', '#00ffff');
                setTimeout(() => {
                    this.walls.forEach(wall => wall.setAttribute('color', '#ff0055'));
                    this.floor.setAttribute('color', '#ff0055');
                }, 1000);

                this.updateUI();

                if (this.shardsCollected === this.totalShards) {
                    this.messageUI.innerText = "Η ΕΞΟΔΟΣ ΕΜΦΑΝΙΣΤΗΚΕ!";
                    this.messageUI.style.color = "#00ff00";
                    this.exitEl.setAttribute('visible', 'true');
                    this.walls.forEach(wall => wall.setAttribute('color', '#ffff00'));
                    this.floor.setAttribute('color', '#ffff00');
                } else {
                    this.messageUI.innerText = "ΑΝΑΜΝΗΣΗ ΒΡΕΘΗΚΕ!";
                    setTimeout(() => { if(!this.levelWon) this.messageUI.innerText = "ΨΑΞΕ ΣΤΟ ΣΚΟΤΑΔΙ..."; }, 1500);
                }
            },

            updateUI: function() {
                this.invUI.innerText = `ΑΝΑΜΝΗΣΕΙΣ: ${this.shardsCollected} / ${this.totalShards}`;
            },

            nextLevel: function() {
                this.levelWon = true;
                if (this.currentLevel >= this.maxLevels) {
                    this.wonGame = true;
                    this.messageUI.innerText = "ΤΕΡΜΑΤΙΣΕΣ ΤΟ ΠΑΙΧΝΙΔΙ!\nΤΟ ΔΙΚΤΥΟ ΘΕΡΑΠΕΥΤΗΚΕ.";
                    this.messageUI.style.color = "#00ff00";
                    this.invUI.style.display = 'none';
                    this.levelUI.style.display = 'none';
                } else {
                    this.messageUI.innerText = "ΠΥΛΗ ΑΝΟΙΧΤΗ!\nΦΟΡΤΩΣΗ ΕΠΟΜΕΝΟΥ ΕΠΙΠΕΔΟΥ...";
                    this.currentLevel++;
                    setTimeout(() => this.loadLevel(this.currentLevel), 3000);
                }
            }
        });
    </script>
</head>
<body style="margin: 0; overflow: hidden; background-color: #000;">

    <div style="position: absolute; top: 5%; left: 0; width: 100%; text-align: center; z-index: 100; pointer-events: none;">
        <div id="hud-level" style="color: #ffff00; font-family: 'Courier New', Courier, monospace; font-size: 1.5rem; font-weight: bold; background: rgba(0, 0, 0, 0.7); display: inline-block; padding: 5px 15px; border-radius: 5px; margin-bottom: 5px;">
            ΕΠΙΠΕΔΟ: 1 / 10
        </div>
        <br>
        <div id="hud-message" style="color: #ffffff; font-family: 'Courier New', Courier, monospace; font-size: 1.2rem; text-shadow: 2px 2px 0px #000; background: rgba(0, 0, 0, 0.7); display: inline-block; padding: 10px 20px; border-radius: 5px; border: 1px solid #ffffff; white-space: pre-line; text-transform: uppercase; margin-bottom: 5px;">
            ΒΡΕΣ ΤΙΣ ΚΡΥΜΜΕΝΕΣ ΑΝΑΜΝΗΣΕΙΣ
        </div>
        <br>
        <div id="hud-inv" style="color: #00ffff; font-family: 'Courier New', Courier, monospace; font-size: 1.2rem; font-weight: bold; background: rgba(0, 0, 0, 0.8); display: inline-block; padding: 8px 15px; border-radius: 5px; border: 1px solid #00ffff;">
            ΑΝΑΜΝΗΣΕΙΣ: 0 / 2
        </div>
    </div>

    <a-scene procedural-maze background="color: #111122">
        
        <a-light type="ambient" intensity="0.8" color="#ffffff"></a-light>
        
        <a-plane id="floor-grid" position="50 0 50" rotation="-90 0 0" width="300" height="300" color="#ff0055" wireframe="true"></a-plane>

        <a-entity id="maze-container"></a-entity>

        <a-entity id="camera" camera look-controls wasd-controls="acceleration: 25">
            <a-light type="point" intensity="1" distance="15" color="#ffffff" position="0 0 -1"></a-light>
        </a-entity>
    </a-scene>

</body>
</html>
