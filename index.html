<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>VR II: Σφάλμα Μνήμης</title>
    <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
    <script>
        // ΧΑΡΤΗΣ ΠΛΟΗΓΗΣΗΣ (Grid 3x3)
        // Το 0 σημαίνει "αδιέξοδο"
        const MAP = [
            [0, 5, 6],
            [2, 1, 0],
            [0, 3, 4]
        ];

        // ΕΛΛΗΝΙΚΑ ΚΕΙΜΕΝΑ ΠΕΡΙΒΑΛΛΟΝΤΟΣ
        const TEXT = [
            'Εκκίνηση... Τομέας 0:\nΕντοπίστηκαν σφάλματα.',
            'Κατεστραμμένη Πύλη:\nΑπαιτείται "Κλειδί_Συστήματος.exe"',
            'Υπερχείλιση Μνήμης.\nΤο Firewall παρακολουθεί...',
            'Θύρα 8080:\nΗ έξοδος στο Δίκτυο. Είσαι έτοιμος;',
            'Διαγραμμένος Κώδικας:\n"Βοήθησέ με να επαναφερθώ..."',
            'Ο Πυρήνας.\nΑναμονή για Δικαιώματα Διαχειριστή...'
        ];

        AFRAME.registerComponent('game-logic', {
            init: function () {
                this.currentScene = 1;
                // Αρχίζουμε με το πρώτο αντικείμενο
                this.inventory = ['Κλειδί_Συστήματος.exe'];
                this.textEl = document.querySelector('#info');
                
                // Προσθέτουμε events στα βελάκια
                const directions = ['north', 'south', 'east', 'west'];
                directions.forEach(dir => {
                    const cone = document.querySelector('#' + dir);
                    if (cone) {
                        cone.addEventListener('click', () => this.move(dir));
                    }
                });

                document.querySelectorAll('.object').forEach(el => {
                    el.addEventListener('click', (e) => this.interact(e.target));
                });

                this.updateScene();
            },

            getCoords: function(sceneId) {
                for (let y = 0; y < 3; y++) {
                    for (let x = 0; x < 3; x++) {
                        if (MAP[y][x] === sceneId) return { x, y };
                    }
                }
                return null;
            },

            move: function(dir) {
                let coords = this.getCoords(this.currentScene);
                if (!coords) return;

                let nx = coords.x;
                let ny = coords.y;

                if (dir === 'north') ny--;
                if (dir === 'south') ny++;
                if (dir === 'east') nx++;
                if (dir === 'west') nx--;

                if (ny >= 0 && ny < 3 && nx >= 0 && nx < 3 && MAP[ny][nx] !== 0) {
                    this.currentScene = MAP[ny][nx];
                    this.updateScene();
                }
            },

            interact: function(el) {
                let pick = el.getAttribute('pick');
                let drop = el.getAttribute('drop');
                let goal = el.getAttribute('goal');
                let fail = el.getAttribute('fail');

                if (drop) {
                    // Αν απαιτεί αντικείμενο που ΕΧΟΥΜΕ
                    if (this.inventory.includes(drop)) {
                        this.displayText(goal || "Δεδομένα έγιναν αποδεκτά.");
                        // Προαιρετικά: Αν θέλουμε να του αφαιρεί το αντικείμενο, βάζουμε κώδικα εδώ.
                        // Για να πάρει την ανταμοιβή του (αν υπάρχει):
                        if (pick && !this.inventory.includes(pick)) {
                            this.inventory.push(pick);
                            el.setAttribute('visible', 'false');
                            el.classList.remove('interactive', 'object');
                        }
                    } else {
                        // Αν δεν έχουμε το σωστό αντικείμενο
                        this.displayText(fail || "Σφάλμα: Λείπουν δεδομένα.");
                    }
                } else if (pick) {
                    // Αν είναι απλά αντικείμενο για μάζεμα
                    if (!this.inventory.includes(pick)) {
                        this.inventory.push(pick);
                        this.displayText("ΑΠΟΚΤΗΘΗΚΕ:\n" + pick);
                        el.setAttribute('visible', 'false');
                        el.classList.remove('interactive', 'object');
                    }
                }
                
                // Ανανεώνουμε το κείμενο μετά από 2 δευτερόλεπτα για να δείξουμε ξανά το inventory
                setTimeout(() => this.updateScene(), 2500);
            },

            updateScene: function() {
                // Κρύβουμε όλες τις σκηνές
                document.querySelectorAll('.scene').forEach(scene => {
                    scene.setAttribute('visible', 'false');
                    scene.querySelectorAll('.object').forEach(obj => obj.classList.remove('interactive'));
                });

                // Εμφανίζουμε τη σωστή σκηνή
                let activeScene = document.querySelector('#scene' + this.currentScene);
                if (activeScene) {
                    activeScene.setAttribute('visible', 'true');
                    activeScene.querySelectorAll('.object').forEach(obj => {
                        if (obj.getAttribute('visible') !== 'false') {
                            obj.classList.add('interactive');
                        }
                    });
                }

                // ΕΞΥΠΝΗ ΕΜΦΑΝΙΣΗ ΒΕΛΩΝ (ΚΩΝΩΝ)
                let coords = this.getCoords(this.currentScene);
                const dirs = {
                    'north': {x: 0, y: -1},
                    'south': {x: 0, y: 1},
                    'east': {x: 1, y: 0},
                    'west': {x: -1, y: 0}
                };

                Object.keys(dirs).forEach(dir => {
                    let arrow = document.querySelector('#' + dir);
                    let nx = coords.x + dirs[dir].x;
                    let ny = coords.y + dirs[dir].y;
                    
                    // Ελέγχουμε αν υπάρχει επόμενη σκηνή προς αυτή την κατεύθυνση
                    if (ny >= 0 && ny < 3 && nx >= 0 && nx < 3 && MAP[ny][nx] !== 0) {
                        arrow.setAttribute('visible', 'true'); // Εμφάνιση βέλους
                        arrow.classList.add('interactive');    // Γίνεται κλικ
                    } else {
                        arrow.setAttribute('visible', 'false'); // Απόκρυψη αν είναι αδιέξοδο
                        arrow.classList.remove('interactive');
                    }
                });

                // Ενημέρωση Κειμένου και Inventory
                let sceneText = TEXT[this.currentScene - 1];
                let invText = "\n\nΑΠΟΘΗΚΗ ΔΕΔΟΜΕΝΩΝ: " + (this.inventory.length > 0 ? this.inventory.join(", ") : "Άδεια");
                this.displayText(sceneText + invText);
            },

            displayText: function(str) {
                this.textEl.setAttribute('value', str);
                this.textEl.setAttribute('color', '#ffffff');
                setTimeout(() => this.textEl.setAttribute('color', '#00ff00'), 150);
            }
        });
    </script>
</head>

<body>
    <a-scene cursor="rayOrigin: mouse" raycaster="objects: .interactive" game-logic>
        
        <a-sky color="#050505"></a-sky>
        <a-sphere radius="30" wireframe="true" color="#113322" animation="property: rotation; to: 0 360 0; loop: true; dur: 100000"></a-sphere>

        <a-camera wasd-controls="enabled:false">
            <a-plane color="#000" height="0.6" width="1.6" opacity="0.8" position="0 -0.6 -1">
                <a-text id="info" wrap-count="45" width="1.4" value="Φόρτωση..." color="#00ff00" font="roboto" align="center" position="0 0 0.01"></a-text>
                
                <a-cone id="east" color="#00ffff" scale="0.05 0.05 0.05" position="0.9 0 0" rotation="0 -30 -88"></a-cone>
                <a-cone id="west" color="#00ffff" scale="0.05 0.05 0.05" position="-0.9 0 0" rotation="0 30 88"></a-cone>
                <a-cone id="north" color="#00ffff" scale="0.05 0.05 0.05" position="0 0.35 0" rotation="-20 0 0"></a-cone>
                <a-cone id="south" color="#00ffff" scale="0.05 0.05 0.05" position="0 -0.35 0" rotation="-40 0 180"></a-cone>
            </a-plane>
            <a-cursor fuse="true" animation__fusing="property: scale; from: 1 1 1; to: 0.1 0.1 0.1; dur: 1500; startEvents: fusing" color="#ff00ff"></a-cursor>
        </a-camera>

        <a-entity id="scene1" class="scene" visible="true">
            <a-box position="0 1 -4" rotation="0 45 0" wireframe="true" color="#00ff00" scale="1 1 1" animation="property: rotation; to: 0 405 0; loop: true; dur: 4000"></a-box>
        </a-entity>

        <a-entity id="scene2" class="scene" visible="false">
            <a-cylinder class="object" position="-3 1 -4" scale="0.5 2 0.5" color="#ff0055" wireframe="true" 
                drop="Κλειδί_Συστήματος.exe" 
                pick="Κρυπτογραφημένο_Hash" 
                goal='Επιτυχής Ταυτοποίηση.\nΤο Hash δημιουργήθηκε.'
                fail='Πρόσβαση Απορρίφθηκε.\nΧρειάζεσαι το Κλειδί Συστήματος.'>
            </a-cylinder>
        </a-entity>

        <a-entity id="scene3" class="scene" visible="false">
            <a-dodecahedron class="object" position="-1.25 0.75 -4" scale="1 1 1" color="#ffff00" wireframe="true"
                drop="Δικαιώματα_Admin" 
                goal='Firewall παρακάμφθηκε...\nΕίσαι μέσα.'
                fail='Προειδοποίηση!\nΜη εγγεγραμμένη οντότητα.'>
            </a-dodecahedron>
        </a-entity>

        <a-entity id="scene4" class="scene" visible="false">
            <a-torus-knot class="object" position="4 2 1" scale="0.3 0.3 0.3" color="#00ffff" wireframe="true"
                drop="Κρυπτογραφημένο_Hash" 
                goal="Μεταφόρτωση ολοκληρώθηκε.\nΕίσαι ελεύθερος στο δίκτυο!"
                fail='Σφάλμα:\nΑδυναμία σύνδεσης (Λείπει το Hash).'>
            </a-torus-knot>
        </a-entity>

        <a-entity id="scene5" class="scene" visible="false">
            <a-octahedron class="object" position="-4 -1.5 2.5" color="#ffffff" wireframe="true"
                drop="Κρυπτογραφημένο_Hash" 
                goal='Δεδομένα ανακτήθηκαν!\nΕυχαριστώ χρήστη.' 
                fail='Κατεστραμμένοι τομείς.\nΑδυναμία ανάγνωσης.'>
            </a-octahedron>
        </a-entity>

        <a-entity id="scene6" class="scene" visible="false">
            <a-entity class="object" position="0 2 -8" pick="Δικαιώματα_Admin">
                <a-cylinder radius="2" height="4" color="#ff00ff" wireframe="true" animation="property: rotation; to: 360 0 0; loop: true; dur: 8000"></a-cylinder>
                <a-sphere radius="1" color="#00ffff" wireframe="true"></a-sphere>
            </a-entity>
        </a-entity>

    </a-scene>
</body>
</html>
