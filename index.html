<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>Castle Crusher VR (Fixed v3) | Digital Arts Project</title>
    <script src="https://aframe.io/releases/1.4.0/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/gh/c-frame/aframe-physics-system@v4.2.2/dist/aframe-physics-system.min.js"></script>
    
    <script>
      // Global Game State
      let currentLevel = 1;
      let timeLeft = 30;
      let timerActive = false;
      let timerInterval;

      // Component: Κατασκευή Αρχιτεκτονικού Κάστρου
      AFRAME.registerComponent('structural-castle', {
        schema: { level: {type: 'number', default: 1} },
        
        init: function () {
          this.build();
        },

        // Βοηθητική συνάρτηση για τη δημιουργία ενός δομικού λίθου
        createBlock: function(container, position, size, mass, color, isTower) {
          const block = document.createElement('a-box');
          block.setAttribute('position', position);
          block.setAttribute('width', size.w);
          block.setAttribute('height', size.h);
          block.setAttribute('depth', size.d);
          
          // Υλικό: Πέτρα
          block.setAttribute('material', {
            src: 'https://cdn.jsdelivr.net/gh/mrdoob/three.js@master/examples/textures/brick_diffuse.jpg',
            repeat: `${size.w} ${size.h}`,
            color: color
          });
          
          // Δυναμικό σώμα
          // Αυξάνουμε mass & friction για ευστάθεια
          block.setAttribute('dynamic-body', `mass: ${mass}; friction: 1.0; restitution: 0.1`);
          block.setAttribute('class', 'castle-block');
          if(isTower) block.classList.add('tower');

          container.appendChild(block);
        },

        build: function() {
          const level = this.data.level;
          const container = this.el;
          
          // Διάσταση κάστρου ανάλογα με το Level
          const baseSize = 6 + (level * 1.0);
          const castleDepth = -18; // Απόσταση από τον παίκτη
          const floorY = 0.5; // Το ύψος της στατικής βάσης

          // 1. ΘΕΜΕΛΙΑ (Στατικά - δεν πέφτουν)
          const base = document.createElement('a-box');
          base.setAttribute('position', `0 ${floorY / 2} ${castleDepth}`);
          base.setAttribute('width', baseSize);
          base.setAttribute('height', floorY);
          base.setAttribute('depth', baseSize);
          base.setAttribute('color', '#444');
          base.setAttribute('static-body', '');
          container.appendChild(base);

          // 2. ΠΥΡΓΟΙ (Στις 4 γωνίες) - Δυναμικοί αλλά βαριοί
          const towerSize = {w: 1.8, h: 5 + (level * 0.4), d: 1.8};
          const towerMass = 150 + (level * 25); // Πολύ βαρύ
          const towerOffset = (baseSize / 2) - 0.9;
          const towerColor = '#777';
          
          const towerPositions = [
            {x: -towerOffset, z: castleDepth - towerOffset},
            {x: towerOffset, z: castleDepth - towerOffset},
            {x: -towerOffset, z: castleDepth + towerOffset},
            {x: towerOffset, z: castleDepth + towerOffset}
          ];

          towerPositions.forEach(pos => {
            this.createBlock(container, `${pos.x} ${towerSize.h/2 + floorY} ${pos.z}`, towerSize, towerMass, towerColor, true);
          });

          // 3. ΤΕΙΧΗ (Ανάμεσα στους πύργους) - Πιο εύθραυστα
          const wallThick = 0.8;
          const wallHeight = towerSize.h - 1.2;
          const wallLen = baseSize - (towerSize.w * 2) + 0.2;
          const wallMass = 15 + (level * 5);
          const wallColor = '#aaa';
          
          // Πίσω τείχος (facing player)
          this.createBlock(container, `0 ${wallHeight/2 + floorY} ${castleDepth - towerOffset}`, {w: wallLen, h: wallHeight, d: wallThick}, wallMass, wallColor, false);
          // Πλάγια τείχη
          this.createBlock(container, `${-towerOffset} ${wallHeight/2 + floorY} 0`, {w: wallThick, h: wallHeight, d: wallLen}, wallMass, wallColor, false);
          this.createBlock(container, `${towerOffset} ${wallHeight/2 + floorY} 0`, {w: wallThick, h: wallHeight, d: wallLen}, wallMass, wallColor, false);
          // Πλάγια τείχη χρειάζονται διόρθωση θέσης relative to castleDepth
          container.querySelectorAll('.castle-block:not(.tower)').forEach(b => {
             if(b.getAttribute('position').z == '0') {
                let pos = b.getAttribute('position');
                b.setAttribute('position', `${pos.x} ${pos.y} ${castleDepth}`);
             }
          });

          // 4. ΠΟΛΕΜΙΣΤΡΕΣ (Crenellations) πάνω στα τείχη - Πέφτουν εύκολα
          for (let i=0; i < wallLen; i+=1.4) {
            // Πίσω πολεμίστρες
            this.createBlock(container, `${i - wallLen/2 + 0.7} ${wallHeight + 0.4 + floorY} ${castleDepth - towerOffset}`, {w: 0.7, h: 0.8, d: 0.7}, 5, '#888', false);
          }
        }
      });

      // Component: Game Manager (UI, Timer, Win/Loss, Launch)
      AFRAME.registerComponent('game-manager', {
        init: function () {
          // Ορισμός του "κλικ" στη σκηνή
          this.el.sceneEl.addEventListener('click', this.launchProjectile.bind(this));
          this.startLevel();
        },

        startLevel: function () {
          const scene = this.el.sceneEl;
          
          // Αφαίρεση παλιού κάστρου
          const oldCastle = document.querySelector('#castle');
          if (oldCastle) scene.removeChild(oldCastle);

          // Δημιουργία Νέου Κάστρου
          const newCastle = document.createElement('a-entity');
          newCastle.setAttribute('id', 'castle');
          newCastle.setAttribute('structural-castle', `level: ${currentLevel}`);
          scene.appendChild(newCastle);
          
          // Ρύθμιση χρόνου
          timeLeft = 30 + (currentLevel - 1) * 10;
          this.updateUI();
          
          // Timer
          timerActive = true;
          if (timerInterval) clearInterval(timerInterval);
          timerInterval = setInterval(() => {
            if (!timerActive) return;
            if (timeLeft > 0) {
              timeLeft--;
              this.updateUI();
              this.checkWinCondition();
            } else {
              this.gameOver();
            }
          }, 1000);
        },

        // --- Η ΔΙΟΡΘΩΜΕΝΗ ΣΥΝΑΡΤΗΣΗ ΕΚΤΟΞΕΥΣΗΣ ---
        launchProjectile: function () {
          const scene = this.el.sceneEl;
          const ball = document.createElement('a-sphere');
          
          // Θέση εκτόξευσης: Λίγο πιο μπροστά (-3) για να μην χτυπάει την κάμερα
          ball.setAttribute('position', '0.2 1.5 -3');
          ball.setAttribute('radius', '0.5');
          ball.setAttribute('material', 'src: https://cdn.jsdelivr.net/gh/mrdoob/three.js@master/examples/textures/lava/lavatile.jpg; color: #cc6600');
          
          // Βαριά μπάλα
          ball.setAttribute('dynamic-body', 'mass: 80; friction: 0.01; restitution: 0.6');
          
          scene.appendChild(ball);

          // --- Η Κρίσιμη Αλλαγή ---
          // Αντί για applyImpulse, χρησιμοποιούμε setAttribute('velocity')
          // Μόλις το σώμα φορτωθεί, του δίνουμε ταχύτητα
          ball.addEventListener('body-loaded', function () {
            // Velocity Vector: (X, Y, Z)
            // X=0 (ευθεία), Y=8 (λίγο πάνω - τόξο), Z=-120 (πολύ γρήγορα μπροστά)
            ball.setAttribute('velocity', '0 8 -120'); 
          });

          // Αυτόματη διαγραφή σφαίρας μετά από 6 δευτερόλεπτα
          setTimeout(() => {
            if (ball.parentNode) ball.parentNode.removeChild(ball);
          }, 6000);
        },

        checkWinCondition: function () {
          const blocks = document.querySelectorAll('.castle-block');
          let fallenBlocks = 0;
          
          blocks.forEach(b => {
            // Αν το box έχει πέσει κάτω από το ύψος των θεμελίων (0.6)
            if (b.object3D.position.y < 0.7) {
                fallenBlocks++;
            }
          });

          // Αν το 65% των *δυναμικών* κομματιών έχει πέσει
          if (blocks.length > 0 && fallenBlocks > blocks.length * 0.65) {
            timerActive = false;
            clearInterval(timerInterval);
            if (currentLevel < 10) {
              alert(`🏆🏆🏆 Το Κάστρο ${currentLevel} ισοπεδώθηκε! Ετοιμαστείτε για το Level ${currentLevel + 1}.`);
              currentLevel++;
              this.startLevel();
            } else {
              alert("🎉🎉🎉🎉🎉🎉🎉🎉\nΣΥΓΧΑΡΗΤΗΡΙΑ! ΕΙΣΤΕ Ο ΚΥΡΙΑΡΧΟΣ ΤΗΣ ΚΑΤΑΣΤΡΟΦΗΣ!\nΟλοκληρώσατε και τα 10 levels!");
              currentLevel = 1;
              this.startLevel();
            }
          }
        },

        gameOver: function () {
          timerActive = false;
          clearInterval(timerInterval);
          alert(`💥💥💥 Ο χρόνος τελείωσε! Το κάστρο ${currentLevel} άντεξε.\nΕπανεκκίνηση από το Level 1.`);
          currentLevel = 1;
          this.startLevel();
        },

        updateUI: function () {
          document.querySelector('#timerDisplay').setAttribute('value', `Time: ${timeLeft}`);
          document.querySelector('#levelDisplay').setAttribute('value', `Level: ${currentLevel}`);
        }
      });
    </script>
  </head>
  <body>
    <a-scene physics="gravity: -9.8; debug: false; iterations: 15" game-manager>
      
      <a-assets>
        <img id="groundTex" src="https://cdn.jsdelivr.net/gh/mrdoob/three.js@master/examples/textures/terrain/grasslight-big.jpg">
      </a-assets>

      <a-sky color="#87CEEB"></a-sky>
      <a-plane static-body rotation="-90 0 0" width="200" height="200" src="#groundTex" repeat="50 50"></a-plane>

      <a-entity camera look-controls position="0 1.6 0">
        <a-entity position="0 0 -1">
            <a-text id="timerDisplay" value="" align="center" color="#FF0000" position="0 0.5 0" width="2"></a-text>
            <a-text id="levelDisplay" value="" align="center" position="0 0.4 0" color="#000" width="1.5"></a-text>
            <a-text value="CLICK ANYWHERE TO SHOOT" align="center" position="0 -0.4 0" color="#333" width="1"></a-text>
        </a-entity>
      </a-entity>

    </a-scene>
  </body>
</html>
