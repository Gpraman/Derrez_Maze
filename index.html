<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>Castle Crusher VR | Digital Arts Project</title>
    <script src="https://aframe.io/releases/1.4.0/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/gh/c-frame/aframe-physics-system@v4.2.2/dist/aframe-physics-system.min.js"></script>
    
    <script>
      // Καθολικές μεταβλητές παιχνιδιού
      let currentLevel = 1;
      let timeLeft = 30;
      let timerActive = false;
      let timerInterval;

      AFRAME.registerComponent('game-logic', {
        init: function () {
          this.el.addEventListener('click', (evt) => {
            if (evt.detail.cursorEl) this.launchProjectile();
          });
          this.startLevel();
        },

        startLevel: function () {
          const container = document.querySelector('#castle-container');
          container.innerHTML = ''; // Καθαρισμός
          
          // Ρύθμιση δυσκολίας
          timeLeft = 30 + (currentLevel - 1) * 10;
          this.updateUI();
          this.spawnCastle(currentLevel);
          
          // Έναρξη Timer
          timerActive = true;
          if (timerInterval) clearInterval(timerInterval);
          timerInterval = setInterval(() => {
            if (timeLeft > 0) {
              timeLeft--;
              this.updateUI();
              this.checkWinCondition();
            } else {
              this.gameOver();
            }
          }, 1000);
        },

        spawnCastle: function (level) {
          const container = document.querySelector('#castle-container');
          const rows = 3 + level; // Περισσότερες σειρές ανά level
          const cols = 3;
          
          for (let y = 0; y < rows; y++) {
            for (let x = 0; x < cols; x++) {
              let block = document.createElement('a-box');
              // Αυξάνουμε τη μάζα σταδιακά για να είναι πιο "γερό" το κάστρο
              let mass = 1 + (level * 0.5); 
              block.setAttribute('dynamic-body', `mass: ${mass}; friction: 0.5`);
              block.setAttribute('width', '0.8');
              block.setAttribute('height', '0.8');
              block.setAttribute('depth', '0.8');
              block.setAttribute('position', `${x - 1} ${y * 0.8 + 0.4} -12`);
              block.setAttribute('color', level % 2 === 0 ? '#708090' : '#4b5320');
              block.setAttribute('class', 'castle-block');
              container.appendChild(block);
            }
          }
        },

        launchProjectile: function () {
          const ball = document.querySelector('#projectile');
          // Επαναφορά σφαίρας μπροστά από την κάμερα
          ball.setAttribute('position', '0 1.5 -2');
          ball.body.velocity.set(0, 0, 0);
          ball.body.angularVelocity.set(0, 0, 0);
          
          // Ώθηση προς τα εμπρός (Z-axis) και λίγο πάνω (Y-axis)
          const force = -40; 
          ball.body.applyImpulse(
            new CANNON.Vec3(0, 5, force), 
            new CANNON.Vec3(0, 0, 0)
          );
        },

        checkWinCondition: function () {
          const blocks = document.querySelectorAll('.castle-block');
          let fallenBlocks = 0;
          blocks.forEach(b => {
            if (b.object3D.position.y < 0.3) fallenBlocks++;
          });

          // Αν πέσει το 80% των blocks, πας στο επόμενο level
          if (fallenBlocks > blocks.length * 0.8) {
            clearInterval(timerInterval);
            if (currentLevel < 10) {
              alert(`Level ${currentLevel} ολοκληρώθηκε! Πάμε στο επόμενο.`);
              currentLevel++;
              this.startLevel();
            } else {
              alert("Κέρδισες το παιχνίδι!");
              currentLevel = 1;
              this.startLevel();
            }
          }
        },

        gameOver: function () {
          clearInterval(timerInterval);
          alert("Ο χρόνος τελείωσε! Προσπάθησε ξανά.");
          currentLevel = 1;
          this.startLevel();
        },

        updateUI: function () {
          document.querySelector('#timerDisplay').setAttribute('value', `Time: ${timeLeft}`);
          document.querySelector('#levelDisplay').setAttribute('value', `Level: ${currentLevel}`);
        }
      });
    </script>
  </head>
  <body>
    <a-scene physics="gravity: -9.8; debug: false" game-logic>
      
      <a-assets>
        <img id="groundTex" src="https://cdn.jsdelivr.net/gh/mrdoob/three.js@master/examples/textures/terrain/grasslight-big.jpg">
      </a-assets>

      <a-sky color="#87CEEB"></a-sky>
      <a-plane static-body rotation="-90 0 0" width="100" height="100" src="#groundTex" repeat="20 20"></a-plane>

      <a-entity position="0 3.5 -4">
        <a-text id="timerDisplay" value="" align="center" color="#FF0000" scale="1.5 1.5 1.5"></a-text>
        <a-text id="levelDisplay" value="" align="center" position="0 -0.6 0" color="#000"></a-text>
        <a-text value="Click to Shoot!" align="center" position="0 -1.2 0" color="#333" scale="0.8 0.8 0.8"></a-text>
      </a-entity>

      <a-sphere id="projectile" dynamic-body="mass: 10" radius="0.4" color="#222" position="0 -10 0"></a-sphere>
      
      <a-box position="0 0.2 -2" width="1" height="0.4" depth="2" color="#5C4033" static-body></a-box>

      <a-entity id="castle-container"></a-entity>

      <a-entity camera look-controls position="0 1.6 0">
        <a-cursor color="red"></a-cursor>
      </a-entity>

    </a-scene>
  </body>
</html>
