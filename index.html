<!DOCTYPE html>
<html lang="el">
  <head>
    <meta charset="utf-8">
    <title>VR Duck Hunt - Low-Poly Prototype</title>
    <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>

    <script>
      /* ========================================================
         1. ΣΥΣΤΗΜΑ ΓΕΝΝΗΣΗΣ ΠΑΠΙΩΝ (Duck Spawner & AI)
         Δημιουργεί και κινεί τις πάπιες τυχαία.
         ======================================================== */
      let score = 0;

      AFRAME.registerComponent('duck-ai', {
        schema: {
          speed: { type: 'number', default: 0.08 }, // Ταχύτητα πάπιας
          lifetime: { type: 'number', default: 5000 } // Χρόνος μέχρι να φύγει (5sec)
        },
        init: function () {
          let el = this.el;
          
          // Τυχαία κατεύθυνση πτήσης (Vector)
          this.direction = new THREE.Vector3(
            (Math.random() - 0.5) * 2, // X: τυχαία αριστερά/δεξιά
            (Math.random() * 0.5) + 0.1, // Y: πάντα προς τα πάνω
            (Math.random() - 0.5) * 1 // Z: λίγο μπρος/πίσω
          );
          this.direction.normalize().multiplyScalar(this.data.speed);

          // Αυτοκαταστροφή αν δεν την πετύχεις
          this.timer = setTimeout(() => {
            if(el.parentNode) el.parentNode.removeChild(el);
          }, this.data.lifetime);

          // Αλληλεπίδραση (MouseEnter / Click)
          el.addEventListener('mouseenter', () => el.setAttribute('color', '#ff0')); // Γίνεται κίτρινη όταν τη σημαδεύεις
          el.addEventListener('mouseleave', () => el.setAttribute('color', '#654321')); // Επιστρέφει στο καφέ

          // Όταν την πετύχεις
          el.addEventListener('click', () => {
            score += 50; // +50 πόντοι
            document.querySelector('#score-text').setAttribute('value', 'Score: ' + score);
            
            clearTimeout(this.timer); // Ακύρωση του timer αυτοκαταστροφής
            // Εφέ "πτώσης" (απλή κίνηση προς τα κάτω)
            el.setAttribute('animation', 'property: position; to: ' + el.getAttribute('position').x + ' 0 ' + el.getAttribute('position').z + '; dur: 500; easing: easeInQuad');
            // Διαγραφή μετά το εφέ
            setTimeout(() => { if(el.parentNode) el.parentNode.removeChild(el); }, 500);
          });
        },
        tick: function () {
          // Κίνηση της πάπιας
          let pos = this.el.getAttribute('position');
          pos.x += this.direction.x;
          pos.y += this.direction.y;
          pos.z += this.direction.z;
          this.el.setAttribute('position', pos);
        }
      });

      // COMPONENT ΓΙΑ ΤΟ GENERATION (Spawner)
      AFRAME.registerComponent('spawner', {
        schema: { interval: { type: 'number', default: 3000 } }, // Νέα πάπια κάθε 3sec
        init: function () {
          this.scene = document.querySelector('a-scene');
          this.timer = setInterval(() => this.spawnDuck(), this.data.interval);
        },
        spawnDuck: function () {
          // Μην γεννάς πολλές πάπιες ταυτόχρονα (max 3)
          if(document.querySelectorAll('.duck').length >= 3) return;

          let duck = document.createElement('a-box'); // Χρησιμοποιούμε κουτί για low-poly αίσθηση
          duck.setAttribute('class', 'duck clickable');
          duck.setAttribute('duck-ai', ''); // Προσθέτουμε την AI
          duck.setAttribute('width', '0.6'); duck.setAttribute('height', '0.4'); duck.setAttribute('depth', '0.8');
          duck.setAttribute('color', '#654321'); // Καφέ σώμα
          
          // Τυχαίο σημείο έναρξης πίσω από τους θάμνους (X: -5 to 5, Z: -10 to -15)
          let spawnX = (Math.random() - 0.5) * 10;
          let spawnZ = -10 - (Math.random() * 5);
          duck.setAttribute('position', {x: spawnX, y: 1, z: spawnZ});

          this.scene.appendChild(duck);
        }
      });
    </script>
  </head>
  <body>
    <a-scene background="color: #87CEEB" spawner>
      
      <a-camera position="0 1.6 0" look-controls wasd-controls="enabled: false">
        <a-entity cursor="fuse: true; fuseTimeout: 500"
                  raycaster="objects: .clickable"
                  position="0 0 -1"
                  geometry="primitive: ring; radiusInner: 0.02; radiusOuter: 0.03"
                  material="color: white; shader: flat"
                  animation__fusing="property: scale; startEvents: fusing; dur: 500; from: 1 1 1; to: 0.1 0.1 0.1"
                  animation__mouseleave="property: scale; startEvents: mouseleave; dur: 100; to: 1 1 1">
        </a-entity>
        
        <a-text id="score-text" value="Score: 0" position="-1.5 1 -2" color="#000" width="4" font="monoid"></a-text>
      </a-camera>

      <a-plane position="0 0 -10" rotation="-90 0 0" width="50" height="50" color="#228B22"></a-plane> <a-sky color="#87CEEB"></a-sky> <a-entity id="bushes" position="0 0 -8">
        <a-sphere position="-4 0.5 0" radius="1.5" color="#006400"></a-sphere>
        <a-sphere position="-2 0.8 1" radius="1.2" color="#228B22"></a-sphere>
        <a-sphere position="0 0.5 0" radius="1.8" color="#006400"></a-sphere>
        <a-sphere position="3 0.7 0.5" radius="1.4" color="#228B22"></a-sphere>
        <a-sphere position="5 0.5 -1" radius="1.6" color="#006400"></a-sphere>
      </a-entity>

    </a-scene>
  </body>
</html>
