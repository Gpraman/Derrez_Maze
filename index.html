<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>Castle Crusher VR (v4 - Aiming) | Digital Arts</title>
    <script src="https://aframe.io/releases/1.4.0/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/gh/c-frame/aframe-physics-system@v4.2.2/dist/aframe-physics-system.min.js"></script>
    
    <script>
      let currentLevel = 1;
      let timeLeft = 30;
      let timerInterval;

      // Component για το "χτίσιμο" του γεμάτου κάστρου
      AFRAME.registerComponent('structural-castle', {
        schema: { level: {type: 'number', default: 1} },
        init: function () {
          this.build();
        },
        createBlock: function(pos, size, mass, color, isDynamic) {
          const block = document.createElement('a-box');
          block.setAttribute('position', pos);
          block.setAttribute('width', size.w);
          block.setAttribute('height', size.h);
          block.setAttribute('depth', size.d);
          block.setAttribute('material', `src: https://cdn.jsdelivr.net/gh/mrdoob/three.js@master/examples/textures/brick_diffuse.jpg; color: ${color}; repeat: ${size.w} ${size.h}`);
          if(isDynamic) {
            block.setAttribute('dynamic-body', `mass: ${mass}; friction: 1; restitution: 0`);
            block.setAttribute('class', 'castle-block');
          } else {
            block.setAttribute('static-body', '');
          }
          this.el.appendChild(block);
        },
        build: function() {
          const level = this.data.level;
          const castleZ = -20;
          const baseSize = 7 + (level * 0.5);

          // 1. Στατική Βάση
          this.createBlock(`0 0.25 ${castleZ}`, {w: baseSize, h: 0.5, d: baseSize}, 0, '#444', false);

          // 2. ΕΞΩΤΕΡΙΚΑ ΤΕΙΧΗ & ΠΥΡΓΟΙ (The Shell)
          const offset = (baseSize / 2) - 1;
          const wallH = 4 + (level * 0.3);
          
          // Πύργοι στις γωνίες
          const towerPos = [[-offset, offset], [offset, offset], [-offset, -offset], [offset, -offset]];
          towerPos.forEach(p => {
            this.createBlock(`${p[0]} ${wallH/2 + 0.5} ${castleZ + p[1]}`, {w: 2, h: wallH + 1, d: 2}, 100, '#666', true);
          });

          // 3. ΕΣΩΤΕΡΙΚΟ ΓΕΜΙΣΜΑ (Το "Κενό" που έλεγες)
          // Προσθέτουμε έναν κεντρικό μεγάλο πύργο (The Keep)
          this.createBlock(`0 ${wallH/2 + 1} ${castleZ}`, {w: 3, h: wallH + 2, d: 3}, 200, '#555', true);
          
          // Προσθέτουμε μερικά εσωτερικά υποστηρίγματα/τοίχους
          this.createBlock(`0 ${wallH/2} ${castleZ + 2}`, {w: 4, h: wallH, d: 0.8}, 50, '#888', true);
          this.createBlock(`0 ${wallH/2} ${castleZ - 2}`, {w: 4, h: wallH, d: 0.8}, 50, '#888', true);
        }
      });

      AFRAME.registerComponent('game-manager', {
        init: function () {
          // Λήψη αναφοράς στην κάμερα για τη στόχευση
          this.cameraEl = document.querySelector('[camera]');
          this.el.sceneEl.addEventListener('click', this.launch.bind(this));
          this.startLevel();
        },

        startLevel: function () {
          const scene = this.el.sceneEl;
          const old = document.querySelector('#castle');
          if (old) scene.removeChild(old);

          const castle = document.createElement('a-entity');
          castle.setAttribute('id', 'castle');
          castle.setAttribute('structural-castle', `level: ${currentLevel}`);
          scene.appendChild(castle);

          timeLeft = 30 + (currentLevel - 1) * 10;
          if(timerInterval) clearInterval(timerInterval);
          timerInterval = setInterval(() => {
            timeLeft--;
            document.querySelector('#timerUI').setAttribute('value', `Time: ${timeLeft}`);
            this.checkWin();
            if(timeLeft <= 0) this.reset();
          }, 1000);
          document.querySelector('#levelUI').setAttribute('value', `Level: ${currentLevel}`);
        },

        launch: function () {
          const ball = document.createElement('a-sphere');
          
          // 1. Βρίσκουμε την κατεύθυνση που κοιτάει η κάμερα
          const direction = new THREE.Vector3();
          this.cameraEl.object3D.getWorldDirection(direction);
          // Το getWorldDirection επιστρέφει το πίσω μέρος της κάμερας, οπότε το αντιστρέφουμε
          direction.multiplyScalar(-1);

          // 2. Θέση εκτόξευσης (μπροστά από την κάμερα)
          const pos = new THREE.Vector3();
          this.cameraEl.object3D.getWorldPosition(pos);
          pos.add(direction.clone().multiplyScalar(2)); // 2 μέτρα μπροστά

          ball.setAttribute('position', pos);
          ball.setAttribute('radius', '0.5');
          ball.setAttribute('material', 'src: https://cdn.jsdelivr.net/gh/mrdoob/three.js@master/examples/textures/lava/lavatile.jpg');
          ball.setAttribute('dynamic-body', 'mass: 60');
          this.el.sceneEl.appendChild(ball);

          ball.addEventListener('body-loaded', () => {
            // 3. Εφαρμογή ταχύτητας βασισμένη στη στόχευση
            // Πολλαπλασιάζουμε την κατεύθυνση με τη δύναμη (π.χ. 60)
            const force = 70;
            const velocity = direction.multiplyScalar(force);
            ball.body.velocity.set(velocity.x, velocity.y + 5, velocity.z); // +5 για λίγο ύψος
          });

          setTimeout(() => { if(ball.parentNode) ball.parentNode.removeChild(ball); }, 5000);
        },

        checkWin: function () {
          const blocks = document.querySelectorAll('.castle-block');
          let fallen = 0;
          blocks.forEach(b => { if(b.object3D.position.y < 0.7) fallen++; });
          if(blocks.length > 0 && fallen > blocks.length * 0.7) {
             alert("Level Up!");
             currentLevel++;
             this.startLevel();
          }
        },

        reset: function() {
          alert("Time Out! Restarting...");
          currentLevel = 1;
          this.startLevel();
        }
      });
    </script>
  </head>
  <body>
    <a-scene physics="gravity: -9.8; debug: false" game-manager>
      <a-assets>
        <img id="grass" src="https://cdn.jsdelivr.net/gh/mrdoob/three.js@master/examples/textures/terrain/grasslight-big.jpg">
      </a-assets>

      <a-sky color="#87CEEB"></a-sky>
      <a-plane static-body rotation="-90 0 0" width="100" height="100" src="#grass" repeat="20 20"></a-plane>

      <a-entity camera look-controls position="0 1.6 0">
        <a-cursor color="red" fuse="false"></a-cursor>
        <a-entity position="0 0.8 -1">
          <a-text id="timerUI" value="Time: 30" align="center" color="red" width="2"></a-text>
          <a-text id="levelUI" value="Level: 1" align="center" position="0 -0.2 0" color="black" width="1.5"></a-text>
        </a-entity>
      </a-entity>
    </a-scene>
  </body>
</html>
