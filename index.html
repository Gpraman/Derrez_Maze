<!DOCTYPE html>
<html lang="el">
  <head>
    <meta charset="utf-8">
    <title>VR Duck Hunt - Level System</title>
    <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>

    <script>
      // Game State
      let currentLevel = 1;
      let ducksHitInLevel = 0;
      let ammo = 3;
      let timeLeft = 30; // 30 δευτερόλεπτα ανά πίστα
      let gameInterval;

      // Ρυθμίσεις Επιπέδων
      function getLevelTarget() { return 5 + (currentLevel - 1) * 5; } // 5, 10, 15...

      AFRAME.registerComponent('game-manager', {
        init: function () {
          this.startLevel();
        },
        startLevel: function () {
          ducksHitInLevel = 0;
          timeLeft = 30;
          ammo = 3;
          this.updateUI();
          
          // Καθαρισμός παλιών timers αν υπάρχουν
          if (gameInterval) clearInterval(gameInterval);
          
          // Έναρξη αντίστροφης μέτρησης
          gameInterval = setInterval(() => {
            timeLeft--;
            this.updateUI();
            if (timeLeft <= 0) {
              this.levelFailed();
            }
          }, 1000);
        },
        updateUI: function () {
          document.querySelector('#level-text').setAttribute('value', 'Level: ' + currentLevel);
          document.querySelector('#target-text').setAttribute('value', 'Target: ' + ducksHitInLevel + '/' + getLevelTarget());
          document.querySelector('#timer-text').setAttribute('value', 'Time: ' + timeLeft);
          document.querySelector('#ammo-text').setAttribute('value', 'Ammo: ' + ammo);
        },
        levelSuccess: function () {
          clearInterval(gameInterval);
          alert("Level " + currentLevel + " Complete!");
          currentLevel++;
          this.startLevel();
        },
        levelFailed: function () {
          clearInterval(gameInterval);
          alert("Time's up! Restarting Level " + currentLevel);
          // Διαγραφή υπαρχουσών παπιών
          document.querySelectorAll('.duck').forEach(d => d.parentNode.removeChild(d));
          this.startLevel();
        }
      });

      AFRAME.registerComponent('duck-ai', {
        init: function () {
          let el = this.el;
          this.direction = new THREE.Vector3((Math.random() - 0.5) * 2, (Math.random() * 0.4) + 0.1, (Math.random() - 0.5) * 1);
          this.direction.normalize().multiplyScalar(0.05 + (currentLevel * 0.01));

          el.addEventListener('click', () => {
            if (ammo > 0) {
              ducksHitInLevel++;
              document.querySelector('[game-manager]').components['game-manager'].updateUI();
              
              el.setAttribute('color', '#f00');
              setTimeout(() => { if(el.parentNode) el.parentNode.removeChild(el); }, 100);

              if (ducksHitInLevel >= getLevelTarget()) {
                document.querySelector('[game-manager]').components['game-manager'].levelSuccess();
              }
              ammo = 3; // Reset ammo on hit
            }
          });
        },
        tick: function () {
          let pos = this.el.getAttribute('position');
          pos.x += this.direction.x; pos.y += this.direction.y; pos.z += this.direction.z;
          this.el.setAttribute('position', pos);
          if (pos.y > 10 || Math.abs(pos.x) > 15) { if(this.el.parentNode) this.el.parentNode.removeChild(this.el); ammo = 3; }
        }
      });

      window.addEventListener('click', () => { if (ammo > 0) { ammo--; document.querySelector('[game-manager]').components['game-manager'].updateUI(); } });
    </script>
  </head>
  <body>
    <a-scene background="color: #87CEEB" game-manager spawner="interval: 2500">
      
      <a-camera position="0 1.6 0" look-controls>
        <a-entity cursor="fuse: true; fuseTimeout: 200" raycaster="objects: .clickable" position="0 0 -1"
                  geometry="primitive: ring; radiusInner: 0.015; radiusOuter: 0.025" material="color: white; shader: flat"></a-entity>
        
        <a-entity position="0 1 -2">
            <a-text id="level-text" value="Level: 1" position="-1.5 0.2 0" color="#000" width="3"></a-text>
            <a-text id="target-text" value="Target: 0/5" position="-1.5 0 0" color="#000" width="3"></a-text>
            <a-text id="timer-text" value="Time: 30" position="1 0.2 0" color="#f00" width="3"></a-text>
            <a-text id="ammo-text" value="Ammo: 3" position="1 0 0" color="#333" width="3"></a-text>
        </a-entity>
      </a-camera>

      <a-plane position="0 0 -10" rotation="-90 0 0" width="100" height="100" color="#228B22"></a-plane>
      <a-sky color="#87CEEB"></a-sky>

      <a-entity id="spawner" spawner></a-entity>
    </a-scene>

    <script>
      // Απλό Spawner Script
      AFRAME.registerComponent('spawner', {
        init: function () {
          setInterval(() => {
            if(document.querySelectorAll('.duck').length < 3) {
                let duck = document.createElement('a-box');
                duck.setAttribute('class', 'duck clickable');
                duck.setAttribute('duck-ai', '');
                duck.setAttribute('width', '0.7'); duck.setAttribute('height', '0.5'); duck.setAttribute('depth', '0.7');
                duck.setAttribute('color', '#654321');
                duck.setAttribute('position', {x: (Math.random()-0.5)*10, y: 0.5, z: -12});
                document.querySelector('a-scene').appendChild(duck);
            }
          }, 2000);
        }
      });
    </script>
  </body>
</html>
