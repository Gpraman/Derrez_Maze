<!DOCTYPE html>
<html lang="el">
  <head>
    <meta charset="utf-8">
    <title>VR Duck Hunt - Easy Mode</title>
    <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>

    <script>
      let score = 0;

      AFRAME.registerComponent('duck-ai', {
        schema: {
          speed: { type: 'number', default: 0.03 }, // ΠΟΛΥ ΠΙΟ ΑΡΓΟ (ήταν 0.08)
          lifetime: { type: 'number', default: 8000 } // Ζουν για 8 δευτερόλεπτα
        },
        init: function () {
          let el = this.el;
          // Τυχαία κατεύθυνση αλλά πιο σταθερή
          this.direction = new THREE.Vector3(
            (Math.random() - 0.5) * 1.5, 
            (Math.random() * 0.3) + 0.05, 
            (Math.random() - 0.5) * 0.5
          );
          this.direction.normalize().multiplyScalar(this.data.speed);

          this.timer = setTimeout(() => {
            if(el.parentNode) el.parentNode.removeChild(el);
          }, this.data.lifetime);

          el.addEventListener('mouseenter', () => el.setAttribute('color', '#ff0'));
          el.addEventListener('mouseleave', () => el.setAttribute('color', '#654321'));

          el.addEventListener('click', () => {
            score += 50;
            document.querySelector('#score-text').setAttribute('value', 'Score: ' + score);
            clearTimeout(this.timer);
            el.setAttribute('animation', 'property: position; to: ' + el.getAttribute('position').x + ' -2 ' + el.getAttribute('position').z + '; dur: 800; easing: easeInQuad');
            setTimeout(() => { if(el.parentNode) el.parentNode.removeChild(el); }, 800);
          });
        },
        tick: function () {
          let pos = this.el.getAttribute('position');
          pos.x += this.direction.x;
          pos.y += this.direction.y;
          pos.z += this.direction.z;
          this.el.setAttribute('position', pos);
        }
      });

      AFRAME.registerComponent('spawner', {
        schema: { interval: { type: 'number', default: 4000 } }, // Νέα πάπια κάθε 4 δευτερόλεπτα
        init: function () {
          this.scene = document.querySelector('a-scene');
          this.timer = setInterval(() => this.spawnDuck(), this.data.interval);
        },
        spawnDuck: function () {
          if(document.querySelectorAll('.duck').length >= 4) return;

          let duck = document.createElement('a-box');
          duck.setAttribute('class', 'duck clickable');
          duck.setAttribute('duck-ai', '');
          // ΜΕΓΑΛΥΤΕΡΟ ΜΕΓΕΘΟΣ (1x1x1 μέτρο) για να είναι εύκολος στόχος
          duck.setAttribute('width', '1'); duck.setAttribute('height', '0.8'); duck.setAttribute('depth', '1');
          duck.setAttribute('color', '#654321');
          
          let spawnX = (Math.random() - 0.5) * 12;
          let spawnZ = -12 - (Math.random() * 5);
          duck.setAttribute('position', {x: spawnX, y: 0.5, z: spawnZ});

          this.scene.appendChild(duck);
        }
      });
    </script>
  </head>
  <body>
    <a-scene background="color: #87CEEB" spawner>
      
      <a-camera position="0 1.6 0" look-controls wasd-controls="enabled: false">
        <a-entity cursor="fuse: true; fuseTimeout: 150"
                  raycaster="objects: .clickable"
                  position="0 0 -1"
                  geometry="primitive: ring; radiusInner: 0.02; radiusOuter: 0.03"
                  material="color: white; shader: flat"
                  animation__fusing="property: scale; startEvents: fusing; dur: 150; from: 1 1 1; to: 0.1 0.1 0.1"
                  animation__mouseleave="property: scale; startEvents: mouseleave; dur: 50; to: 1 1 1">
        </a-entity>
        
        <a-text id="score-text" value="Score: 0" position="-1.5 1 -2" color="#000" width="4" font="monoid"></a-text>
      </a-camera>

      <a-plane position="0 0 -10" rotation="-90 0 0" width="60" height="60" color="#228B22"></a-plane>
      <a-sky color="#87CEEB"></a-sky>

      <a-entity id="bushes" position="0 0 -10">
        <a-sphere position="-5 0.5 0" radius="2" color="#006400"></a-sphere>
        <a-sphere position="0 0.5 0" radius="2.5" color="#006400"></a-sphere>
        <a-sphere position="5 0.5 0" radius="2" color="#006400"></a-sphere>
      </a-entity>

    </a-scene>
  </body>
</html>
