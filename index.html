<!DOCTYPE html>
<html lang="el">
<head>
    <meta charset="utf-8">
    <title>VR II: The Grid - TRON Legacy Edition</title>
    <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
    <script>
        const CELL_SIZE = 4;
        
        // TRON Χρωματική Παλέτα
        const TRON_COLORS = {
            heroCyan: '#00FFFF',    // Sam Flynn Cyan
            enemyOrange: '#FF4500', // Clu/Rinzler Orange-Red
            dataWhite: '#FFFFFF',   // Data Pulse
            gridBlue: '#0000FF',    // Floor Grid Blue
            skyBlack: '#000000'     // Abyss Black
        };

        // Παλέτα εξέλιξης λαβύρινθου (Cyan -> Orange)
        const MAZE_PROGRESSION_COLORS = [TRON_COLORS.heroCyan, TRON_COLORS.enemyOrange];

        AFRAME.registerComponent('procedural-maze', {
            init: function () {
                this.player = document.querySelector('#camera');
                this.mazeContainer = document.querySelector('#maze-container');
                this.messageUI = document.querySelector('#hud-message');
                this.invUI = document.querySelector('#hud-inv');
                this.levelUI = document.querySelector('#hud-level');
                this.floor = document.querySelector('#floor-grid');
                
                this.currentLevel = 1;
                this.maxLevels = 10;
                this.lastPos = new THREE.Vector3();
                this.wonGame = false;
                
                this.loadLevel(this.currentLevel);
            },

            generateMap: function(size) {
                let map = Array(size).fill().map(() => Array(size).fill(1));
                function carve(x, y) {
                    map[y][x] = 0;
                    let dirs = [[0,-1],[0,1],[-1,0],[1,0]].sort(() => Math.random() - 0.5);
                    for (let d of dirs) {
                        let nx = x + d[0]*2, ny = y + d[1]*2;
                        if (nx > 0 && nx < size-1 && ny > 0 && ny < size-1 && map[ny][nx] === 1) {
                            map[y+d[1]][x+d[0]] = 0;
                            carve(nx, ny);
                        }
                    }
                }
                carve(1, 1);
                return map;
            },

            loadLevel: function(level) {
                this.mazeContainer.innerHTML = '';
                this.shards = [];
                this.walls = [];
                this.exitEl = null;
                this.shardsCollected = 0;
                this.levelWon = false;

                let mapSize = 7 + (level * 2); 
                this.totalShards = 2 + Math.floor(level / 2); 
                this.currentMap = this.generateMap(mapSize);

                let emptySpots = [];
                for (let z = 1; z < mapSize - 1; z++) {
                    for (let x = 1; x < mapSize - 1; x++) {
                        if (this.currentMap[z][x] === 0 && (x !== 1 || z !== 1)) {
                            emptySpots.push({x, z});
                        }
                    }
                }
                emptySpots = emptySpots.sort(() => Math.random() - 0.5); 

                // Αρχικό TRON Cyan χρώμα για τους τοίχους
                let startWallColor = TRON_COLORS.heroCyan;

                for (let z = 0; z < mapSize; z++) {
                    for (let x = 0; x < mapSize; x++) {
                        let px = x * CELL_SIZE;
                        let pz = z * CELL_SIZE;

                        if (this.currentMap[z][x] === 1) {
                            // Τοίχοι: TRON 'Solid Light' look
                            let wall = document.createElement('a-box');
                            wall.setAttribute('position', `${px} 2 ${pz}`);
                            wall.setAttribute('width', CELL_SIZE);
                            wall.setAttribute('height', 4);
                            wall.setAttribute('depth', CELL_SIZE);
                            // TRON Αισθητική: Μαύρος τοίχος με Cyan wireframe
                            wall.setAttribute('material', `color: ${TRON_COLORS.skyBlack}; emissive: ${startWallColor}; emissiveIntensity: 0.5; wireframe: true; wireframeLinewidth: 2`);
                            this.mazeContainer.appendChild(wall);
                            this.walls.push(wall);
                        }
                    }
                }

                // Τοποθέτηση Shards ως Identity Discs
                for (let i = 0; i < this.totalShards; i++) {
                    let spot = emptySpots.pop();
                    this.currentMap[spot.z][spot.x] = 3; 
                    
                    let discEntity = document.createElement('a-entity');
                    discEntity.setAttribute('position', `${spot.x * CELL_SIZE} 1.6 ${spot.z * CELL_SIZE}`);
                    discEntity.setAttribute('animation', 'property: rotation; to: 0 360 0; loop: true; dur: 1000; easing: linear');
                    discEntity.setAttribute('visible', 'false'); // Stealth Proximity

                    // Identity Disc geometry (Torus)
                    let disc = document.createElement('a-torus');
                    disc.setAttribute('radius', 0.5);
                    disc.setAttribute('radius-tubular', 0.05);
                    disc.setAttribute('color', TRON_COLORS.dataWhite);
                    disc.setAttribute('material', `emissive: ${TRON_COLORS.heroCyan}; emissiveIntensity: 2; shader: flat`);
                    disc.setAttribute('rotation', '90 0 0'); // Horizontal orientation
                    
                    // Add a pulse animation
                    disc.setAttribute('animation__pulse', 'property: scale; from: 1 1 1; to: 1.1 1.1 1.1; dur: 500; dir: alternate; loop: true');

                    discEntity.appendChild(disc);
                    discEntity.gridPos = {x: spot.x, z: spot.z};
                    this.mazeContainer.appendChild(discEntity);
                    this.shards.push(discEntity);
                }

                // TRON Portal Exit (Κάθετη δέσμη λευκού φωτός)
                let exitSpot = emptySpots.pop();
                this.currentMap[exitSpot.z][exitSpot.x] = 2; 
                this.exitEl = document.createElement('a-cylinder');
                this.exitEl.setAttribute('position', `${exitSpot.x * CELL_SIZE} 10 ${exitSpot.z * CELL_SIZE}`); // High pillar
                this.exitEl.setAttribute('radius', 1);
                this.exitEl.setAttribute('height', 20);
                this.exitEl.setAttribute('material', `color: ${TRON_COLORS.dataWhite}; emissive: ${TRON_COLORS.heroCyan}; emissiveIntensity: 5; shader: flat; opacity: 0.7; transparent: true`);
                this.exitEl.setAttribute('visible', 'false'); 
                this.mazeContainer.appendChild(this.exitEl);

                // Add a light to the exit
                let exitLight = document.createElement('a-light');
                exitLight.setAttribute('type', 'point');
                exitLight.setAttribute('color', TRON_COLORS.dataWhite);
                exitLight.setAttribute('intensity', 3);
                exitLight.setAttribute('distance', 15);
                this.exitEl.appendChild(exitLight);

                this.player.setAttribute('position', `${1 * CELL_SIZE} 1.6 ${1 * CELL_SIZE}`);
                this.lastPos.copy(this.player.getAttribute('position'));
                
                // Floor: TRON Blue Grid
                this.floor.setAttribute('color', TRON_COLORS.gridBlue);
                this.levelUI.innerText = `ΕΠΙΠΕΔΟ: ${this.currentLevel} / ${this.maxLevels}`;
                this.messageUI.innerText = "ΑΝΑΚΤΗΣΕ ΤΑ ΔΕΔΟΜΕΝΑ";
                this.messageUI.style.color = TRON_COLORS.dataWhite;
                this.messageUI.style.borderColor = TRON_COLORS.heroCyan;
                this.updateUI();
            },

            tick: function () {
                if (this.wonGame || this.levelWon) return;

                let pos = this.player.getAttribute('position');
                let gridX = Math.round(pos.x / CELL_SIZE);
                let gridZ = Math.round(pos.z / CELL_SIZE);

                // TRON Stealth: Τα discs εμφανίζονται μόνο από ΠΟΛΥ κοντά (Απόσταση 5)
                let visibilityRadius = 5; 
                this.shards.forEach(shard => {
                    if (shard.parentNode) {
                        let dist = pos.distanceTo(shard.object3D.position);
                        if (dist < visibilityRadius) {
                            shard.setAttribute('visible', 'true');
                        } else {
                            shard.setAttribute('visible', 'false');
                        }
                    }
                });

                if (gridZ >= 0 && gridZ < this.currentMap.length && gridX >= 0 && gridX < this.currentMap[0].length) {
                    let tileType = this.currentMap[gridZ][gridX];

                    if (tileType === 3) {
                        this.collectShard(gridX, gridZ);
                        return;
                    }

                    if (tileType === 2 && this.shardsCollected === this.totalShards) {
                        this.nextLevel();
                        return;
                    }

                    if (tileType === 1) {
                        this.player.setAttribute('position', this.lastPos);
                    } else {
                        this.lastPos.copy(pos);
                    }
                } else {
                    this.lastPos.copy(pos);
                }
            },

            collectShard: function(x, z) {
                this.currentMap[z][x] = 0; 
                this.shardsCollected++;
                
                let shardToRemove = this.shards.find(s => s.gridPos.x === x && s.gridPos.z === z);
                if (shardToRemove && shardToRemove.parentNode) {
                    shardToRemove.parentNode.removeChild(shardToRemove);
                }

                this.updateUI();

                if (this.shardsCollected === this.totalShards) {
                    // Όταν βρεθούν όλα, το περιβάλλον γίνεται Orange (Clu look) και εμφανίζεται το Portal
                    this.messageUI.innerText = "PORTAL ΕΝΕΡΓΟΠΟΙΗΘΗΚΕ!";
                    this.messageUI.style.color = TRON_COLORS.enemyOrange;
                    this.messageUI.style.borderColor = TRON_COLORS.enemyOrange;
                    this.exitEl.setAttribute('visible', 'true');
                    this.walls.forEach(wall => wall.setAttribute('material', `color: ${TRON_COLORS.skyBlack}; emissive: ${TRON_COLORS.enemyOrange}; emissiveIntensity: 1; wireframe: true`));
                    this.floor.setAttribute('color', TRON_COLORS.enemyOrange);
                } else {
                    // Αλλαγή Χρώματος (Αναλόγως της προόδου - TRON Cyan)
                    this.walls.forEach(wall => wall.setAttribute('material', `color: ${TRON_COLORS.skyBlack}; emissive: ${TRON_COLORS.heroCyan}; emissiveIntensity: 0.8; wireframe: true`));
                    this.messageUI.innerText = "ΔΕΔΟΜΕΝΑ ΕΝΣΩΜΑΤΩΘΗΚΑΝ";
                    setTimeout(() => { if(!this.levelWon) this.messageUI.innerText = "ΨΑΞΕ ΣΤΟ 'GRID'..."; }, 1500);
                }
            },

            updateUI: function() {
                this.invUI.innerText = `DISCS: ${this.shardsCollected} / ${this.totalShards}`;
                this.invUI.style.color = TRON_COLORS.heroCyan;
                this.invUI.style.borderColor = TRON_COLORS.heroCyan;
            },

            nextLevel: function() {
                this.levelWon = true;
                if (this.currentLevel >= this.maxLevels) {
                    this.wonGame = true;
                    this.messageUI.innerText = "ΤΟ 'GRID' ΕΙΝΑΙ ΕΛΕΥΘΕΡΟ!\nSAM FLYNN, ΕΠΕΣΤΡΕΨΕΣ.";
                    this.messageUI.style.color = TRON_COLORS.dataWhite;
                    this.messageUI.style.borderColor = TRON_COLORS.heroCyan;
                    this.invUI.style.display = 'none';
                    this.levelUI.style.display = 'none';
                    this.el.setAttribute('background', `color: ${TRON_COLORS.heroCyan}`);
                } else {
                    this.messageUI.innerText = "ΠΟΡΤΑΛ ΑΝΟΙΧΤΟ!\nΜΕΤΑΦΟΡΑ ΣΕ ΝΕΟ ΤΟΜΕΑ...";
                    this.currentLevel++;
                    setTimeout(() => this.loadLevel(this.currentLevel), 3000);
                }
            }
        });
    </script>
</head>
<body style="margin: 0; overflow: hidden; background-color: #000;">

    <div style="position: absolute; top: 5%; left: 0; width: 100%; text-align: center; z-index: 100; pointer-events: none;">
        <div id="hud-level" style="color: #FFD700; font-family: 'Courier New', Courier, monospace; font-size: 1.5rem; font-weight: bold; background: rgba(0, 0, 0, 0.9); display: inline-block; padding: 5px 15px; border-radius: 2px; margin-bottom: 5px; border: 1px solid #FFD700; text-transform: uppercase;">
            SECTOR: 1 / 10
        </div>
        <br>
        <div id="hud-message" style="color: #ffffff; font-family: 'Courier New', Courier, monospace; font-size: 1.2rem; background: rgba(0, 0, 0, 0.9); display: inline-block; padding: 10px 20px; border-radius: 2px; border: 2px solid #00FFFF; white-space: pre-line; text-transform: uppercase; margin-bottom: 5px; letter-spacing: 2px;">
            ΑΝΑΚΤΗΣΕ ΤΑ ΔΕΔΟΜΕΝΑ
        </div>
        <br>
        <div id="hud-inv" style="color: #00FFFF; font-family: 'Courier New', Courier, monospace; font-size: 1.2rem; font-weight: bold; background: rgba(0, 0, 0, 0.9); display: inline-block; padding: 8px 15px; border-radius: 2px; border: 1px solid #00FFFF;">
            DISCS: 0 / 2
        </div>
    </div>

    <a-scene procedural-maze background="color: #000000" fog="type: exponential; color: #000000; density: 0.03;">
        
        <a-light type="ambient" intensity="0.2" color="#444466"></a-light>
        
        <a-plane id="floor-grid" position="50 0 50" rotation="-90 0 0" width="300" height="300" color="#0000FF" wireframe="true" wireframe-linewidth="1" material="shader: flat"></a-plane>

        <a-entity id="maze-container"></a-entity>

        <a-entity id="camera" camera look-controls wasd-controls="acceleration: 25">
            <a-light type="point" intensity="1" distance="15" color="#00FFFF" position="0 0 -1"></a-light>
        </a-entity>
    </a-scene>

</body>
</html>
